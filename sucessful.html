<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WayGo – Success</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    #21132f 0%,
                    #100a17 35%,
                    #050406 70%,
                    #000000 100%
                );

            color: white;

            font-family: "Montserrat", sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        /* =========================
           BACKGROUND GLOW
        ========================= */

        .glow {
            position: fixed;

            width: 650px;
            height: 650px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(150, 75, 255, .16),
                    rgba(100, 40, 180, .05) 40%,
                    transparent 70%
                );

            filter: blur(25px);

            animation:
                glowPulse 4s ease-in-out infinite;

            pointer-events: none;
        }


        /* =========================
           CONTENT
        ========================= */

        .content {
            position: relative;

            text-align: center;

            width: 90%;
            max-width: 500px;

            animation:
                appear 1s cubic-bezier(.16,1,.3,1);
        }


        /* =========================
           SUCCESS CIRCLE
        ========================= */

        .success-circle {
            width: 115px;
            height: 115px;

            margin: 0 auto 35px;

            border-radius: 50%;

            border:
                1px solid
                rgba(183, 116, 255, .5);

            background:
                rgba(150, 80, 255, .04);

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 0 45px
                rgba(140, 65, 240, .15),

                inset 0 0 30px
                rgba(140, 65, 240, .05);

            animation:
                circleAppear 1s
                cubic-bezier(.16,1,.3,1);
        }


        /* =========================
           CHECK
        ========================= */

        .check {
            width: 38px;
            height: 20px;

            border-left:
                2px solid #c18aff;

            border-bottom:
                2px solid #c18aff;

            transform:
                rotate(-45deg)
                scale(0);

            animation:
                checkAppear .7s
                .55s
                cubic-bezier(.16,1,.3,1)
                forwards;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(180,110,255,.5)
                );
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            margin-bottom: 30px;
        }


        .wg {
            font-family:
                "Bodoni Moda",
                serif;

            font-size: 50px;

            font-style: italic;

            letter-spacing: -6px;

            color: #b477ff;

            text-shadow:
                0 0 18px
                rgba(160,90,255,.3);
        }


        .waygo {
            margin-top: -5px;

            font-family:
                "Bodoni Moda",
                serif;

            font-size: 22px;

            letter-spacing: 5px;
        }


        /* =========================
           TEXT
        ========================= */

        h1 {
            font-family:
                "Bodoni Moda",
                serif;

            font-size: 37px;

            font-weight: 400;

            margin-bottom: 12px;
        }


        .subtitle {
            color:
                rgba(255,255,255,.45);

            font-size: 11px;

            letter-spacing: .6px;

            line-height: 1.7;

            margin-bottom: 30px;
        }


        /* =========================
           COUNTDOWN
        ========================= */

        .redirect {
            color:
                rgba(255,255,255,.28);

            font-size: 9px;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        .count {
            display: inline-block;

            min-width: 14px;

            color: #b477ff;

            font-weight: 500;
        }


        /* =========================
           PROGRESS
        ========================= */

        .progress {
            width: 180px;

            height: 2px;

            margin: 18px auto 0;

            background:
                rgba(255,255,255,.07);

            border-radius: 10px;

            overflow: hidden;
        }


        .progress-bar {
            height: 100%;

            width: 0%;

            background:
                linear-gradient(
                    90deg,
                    #7135d6,
                    #c18aff
                );

            box-shadow:
                0 0 10px
                rgba(170,100,255,.5);

            animation:
                progress 5s linear forwards;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes appear {

            from {
                opacity: 0;

                transform:
                    translateY(25px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes circleAppear {

            from {
                opacity: 0;

                transform:
                    scale(.65);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);
            }
        }


        @keyframes checkAppear {

            from {
                transform:
                    rotate(-45deg)
                    scale(0);
            }

            to {
                transform:
                    rotate(-45deg)
                    scale(1);
            }
        }


        @keyframes glowPulse {

            0%,
            100% {
                transform: scale(1);

                opacity: .8;
            }

            50% {
                transform: scale(1.12);

                opacity: 1;
            }
        }


        @keyframes progress {

            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .success-circle {
                width: 100px;
                height: 100px;
            }

            h1 {
                font-size: 31px;
            }

            .wg {
                font-size: 44px;
            }

        }

    </style>

</head>


<body>


    <div class="glow"></div>


    <main class="content">


        <!-- LOGO -->

        <div class="logo">

            <div class="wg">
                WG
            </div>

            <div class="waygo">
                WayGo
            </div>

        </div>


        <!-- SUCCESS -->

        <div class="success-circle">

            <div class="check"></div>

        </div>


        <!-- TEXT -->

        <h1>
            You're all set.
        </h1>


        <p class="subtitle">
            Your account has been successfully created.<br>
            Welcome to WayGo.
        </p>


        <!-- COUNTDOWN -->

        <div class="redirect">

            Redirecting in
            <span
                class="count"
                id="count"
            >
                5
            </span>
            seconds

        </div>


        <!-- PROGRESS -->

        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>


    </main>


    <script>

        let seconds = 5;

        const count =
            document.getElementById("count");


        const countdown =
            setInterval(() => {

                seconds--;

                count.textContent =
                    seconds;


                if (seconds <= 0) {

                    clearInterval(countdown);

                    window.location.href =
                        "home.html";

                }

            }, 1000);

    </script>


</body>

</html>
