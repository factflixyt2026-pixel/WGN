<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>wayGo — Registrácia</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at 50% 50%, #24104d 0%, #0b0522 40%, #030014 85%);
        }

        /* Vesmír */
        #space {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            opacity: .7;
            animation: twinkle ease-in-out infinite alternate;
            will-change: opacity, transform;
        }

        @keyframes twinkle {
            from {
                opacity: .2;
                transform: scale(.7);
            }

            to {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Registrácia */
        .register-box {
            position: relative;
            z-index: 5;

            width: min(90%, 430px);
            padding: 38px;

            text-align: center;

            background: rgba(10, 5, 30, .84);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 28px;

            box-shadow:
                0 0 35px rgba(124,77,255,.25),
                0 0 80px rgba(34,211,238,.08);

            backdrop-filter: blur(10px);

            animation: appear .7s ease-out;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo */
        .logo {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: -4px;
            margin-bottom: 8px;

            text-shadow:
                0 0 10px #8b5cf6,
                0 0 25px #6366f1;
        }

        .logo span {
            color: #22d3ee;

            text-shadow:
                0 0 10px #22d3ee,
                0 0 25px #22d3ee;
        }

        .subtitle {
            color: #aaa8c4;
            margin-bottom: 28px;
        }

        h2 {
            margin-bottom: 20px;
        }

        /* Inputy */
        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 13px;

            border: 1px solid rgba(255,255,255,.1);
            border-radius: 14px;

            outline: none;

            color: white;
            background: rgba(255,255,255,.07);

            font-size: 15px;

            transition: .2s;
        }

        input:focus {
            border-color: #22d3ee;

            box-shadow:
                0 0 15px rgba(34,211,238,.2);
        }

        input::placeholder {
            color: #77738e;
        }

        /* Tlačidlo */
        button {
            width: 100%;
            padding: 15px;
            margin-top: 8px;

            border: none;
            border-radius: 14px;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    90deg,
                    #7c3aed,
                    #2563eb,
                    #06b6d4
                );

            box-shadow:
                0 0 20px rgba(99,102,241,.35);

            transition: .2s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 30px rgba(34,211,238,.45);
        }

        button:active {
            transform: scale(.98);
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
            transform: none;
        }

        /* Správa */
        #message {
            min-height: 22px;
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .error {
            color: #ff6b9d;
        }

        .success {
            color: #4ade80;
        }

        /* Login */
        .login {
            margin-top: 22px;
            color: #88849e;
            font-size: 14px;
        }

        .login a {
            color: #22d3ee;
            text-decoration: none;
        }

        .login a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .register-box {
                padding: 30px 22px;
            }

            .logo {
                font-size: 45px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <div id="space"></div>

    <div class="register-box">

        <div class="logo">
            way<span>Go</span>
        </div>

        <p class="subtitle">
            🌌 Začni svoju cestu za poznaním
        </p>

        <h2>Vytvor si účet 🚀</h2>

        <form id="registerForm">

            <input
                type="text"
                id="username"
                placeholder="Používateľské meno"
                autocomplete="username"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Heslo"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <input
                type="password"
                id="passwordConfirm"
                placeholder="Zopakuj heslo"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <button type="submit" id="registerButton">
                🚀 Vytvoriť účet
            </button>

        </form>

        <div id="message"></div>

        <div class="login">
            Už máš účet?
            <a href="login.html">Prihlás sa</a>
        </div>

    </div>


    <script>

        // =====================================
        // SUPABASE
        // =====================================

        const SUPABASE_URL =
            "https://uteqhopuobkuzbrytbgw.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_lEGoAcY4kSW8NSNoNihoiw_0KGnlvbo";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // =====================================
        // ELEMENTY
        // =====================================

        const form =
            document.getElementById("registerForm");

        const button =
            document.getElementById("registerButton");

        const message =
            document.getElementById("message");


        // =====================================
        // REGISTRÁCIA
        // =====================================

        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const passwordConfirm =
                document.getElementById("passwordConfirm").value;


            message.textContent = "";
            message.className = "";


            // Kontrola hesiel
            if (password !== passwordConfirm) {

                message.textContent =
                    "❌ Heslá sa nezhodujú.";

                message.className = "error";

                return;
            }


            button.disabled = true;
            button.textContent = "🚀 Vytváram účet...";


            try {

                // Vytvorenie používateľa
                const { data, error } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {
                            data: {
                                username: username
                            }
                        }

                    });


                if (error) {
                    throw error;
                }


                message.textContent =
                    "✨ Účet bol vytvorený!";


                message.className = "success";


                /*
                 * Ak máš v Supabase vypnuté
                 * email confirmation, používateľ
                 * môže byť rovno prihlásený.
                 *
                 * Ak máš potvrdenie emailu zapnuté,
                 * zobrazíme správu.
                 */

                if (data.session) {

                    setTimeout(() => {
                        window.location.href = "home.html";
                    }, 1000);

                } else {

                    message.textContent =
                        "📩 Skontroluj svoj email a potvrď účet.";

                    button.disabled = false;
                    button.textContent = "🚀 Vytvoriť účet";
                }


            } catch (error) {

                console.error(error);

                if (error.message.includes("already registered")) {

                    message.textContent =
                        "❌ Tento email už má účet.";

                } else {

                    message.textContent =
                        "❌ " + error.message;
                }

                message.className = "error";

                button.disabled = false;
                button.textContent = "🚀 Vytvoriť účet";
            }

        });


        // =====================================
        // NÁHODNÉ HVIEZDY
        // =====================================

        const space =
            document.getElementById("space");

        for (let i = 0; i < 80; i++) {

            const star =
                document.createElement("div");

            star.className = "star";

            const size =
                Math.random() * 2.5 + .5;

            star.style.width =
                size + "px";

            star.style.height =
                size + "px";

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            star.style.animationDuration =
                Math.random() * 3 + 1.5 + "s";

            star.style.animationDelay =
                Math.random() * 3 + "s";

            space.appendChild(star);
        }

    </script>

</body>
</html>
