<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overovanie | WayGo</title><style>body{background:#0b0815;color:#e9d7ff;font:16px system-ui;display:grid;place-items:center;min-height:90vh}</style><script defer src="icons.js"></script><link rel="stylesheet" href="polish.css"><link rel="stylesheet" href="experience.css"></head><body><main id="state">Overujeme prihlásenie…</main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>(async()=>{const c=window.WAYGO_CONFIG||{};if(!c.supabaseUrl||!c.supabaseAnonKey)return document.getElementById('state').textContent='Najprv nastav config.js.';const db=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const params=new URLSearchParams(location.search);const code=params.get('code');if(code){const {error}=await db.auth.exchangeCodeForSession(code);if(error)return document.getElementById('state').textContent='Prihlásenie zlyhalo: '+error.message}const {data}=await db.auth.getUser();if(!data.user)return location.replace('login.html');const next=params.get('next');location.replace(next&&/^(home|feed|account|social|vip|admin)\.html$/.test(next)?next:'home.html')})()</script><script src="polish.js" defer></script><script defer src="experience.js"></script></body></html>
