<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nové heslo | WayGo</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');:root{color-scheme:dark;--bg:#090711;--card:#151022;--edge:#30233f;--muted:#a99eb9;--pink:#f18aff;--purple:#9c63ff;--white:#faf6ff}*{box-sizing:border-box}body{margin:0;color:var(--white);background:radial-gradient(ellipse at 90% -5%,#48216a65,transparent 35%),radial-gradient(ellipse at -30% 70%,#25115b40,transparent 50%),var(--bg);font:15px/1.5 'DM Sans',system-ui,sans-serif;min-height:100dvh}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.shell{max-width:1150px;margin:auto;padding:0 24px 110px}.nav{height:77px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12;gap:15px}.logo{font-size:27px;font-weight:800;letter-spacing:-1.5px}.logo i{font-style:normal;color:var(--pink)}.links{display:flex;gap:19px;align-items:center}.links a{color:#d2c4df;font-weight:700;font-size:13px}.links a:hover{color:white}.pill{padding:8px 13px;border-radius:99px;border:1px solid #ffffff20;background:#ffffff0b;font-size:12px;font-weight:700}.vip{background:linear-gradient(110deg,#ffba6b,#ee86f4);color:#1d0c23;border:0}.hero{padding:70px 0 34px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:#d0a6ff;text-transform:uppercase}.hero h1{font-size:clamp(40px,7vw,84px);line-height:1.05;letter-spacing:-4px;margin:18px 0;max-width:840px}.grad{background:linear-gradient(100deg,#e5b5ff,#ae75ff,#fa91d6);background-clip:text;color:transparent}.sub{color:#b7aac8;font-size:17px;max-width:620px}.btn{border:0;border-radius:15px;padding:14px 21px;font-weight:800;background:linear-gradient(110deg,#a66aff,#eb85ed);color:#160b22;display:inline-flex;align-items:center;justify-content:center;gap:9px}.btn.alt{background:#241832;border:1px solid #58406c;color:white}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{border:1px solid var(--edge);border-radius:24px;background:linear-gradient(140deg,#1e1530,#100d1b);padding:24px;box-shadow:0 12px 45px #0002}.card h3{font-size:21px;margin:10px 0}.card p,.muted{color:var(--muted)}.icon{font-size:32px}.big{font-size:40px;font-weight:800;letter-spacing:-2px}.section{margin:42px 0 20px}.section h2{font-size:29px;letter-spacing:-1px}.field{display:block;width:100%;background:#0d0a16;border:1px solid #4a355c;border-radius:14px;color:white;padding:14px 16px;outline:none;margin:9px 0 15px}.field:focus{border-color:#c38aff}.small{font-size:12px;color:#a99eb9}.notice{padding:13px 16px;border:1px solid #73598c;background:#39234a55;border-radius:15px;color:#dec8f6;margin:14px 0}.bottom{display:none}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.hide{display:none!important}@media(max-width:700px){.shell{padding:0 16px 100px}.nav{height:65px}.links{display:none}.hero{padding:48px 0 22px}.hero h1{letter-spacing:-2px}.grid{grid-template-columns:1fr}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#130e20f4;backdrop-filter:blur(18px);border-top:1px solid #3c2851;padding:12px 5px max(12px,env(safe-area-inset-bottom));justify-content:space-around;z-index:80}.bottom a{font-size:11px;text-align:center;color:#d6c3e5}.bottom b{display:block;font-size:20px}.card{padding:19px}} 
.authwrap{max-width:460px;margin:52px auto 70px}.authcard{padding:34px;border-radius:28px;background:linear-gradient(145deg,#241534,#100c1b);border:1px solid #543767;box-shadow:0 25px 90px #0006}.authcard h1{font-size:34px;letter-spacing:-1.6px;margin:8px 0}.authcard p{color:#bcaeca}.full{width:100%;margin:8px 0;display:flex}.social{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:#1e172b;color:white;border:1px solid #514060;padding:13px;border-radius:14px;margin:9px 0;font-weight:700}.social:hover{border-color:#c28cff}.or{text-align:center;color:#9585a8;margin:22px 0}.aux{display:flex;justify-content:space-between;gap:12px;margin:12px 0;color:#cfafff;font-size:13px}.authcard a{color:#d4a4ff}.authcard a:hover{text-decoration:underline}#message{min-height:25px;font-size:13px;line-height:1.6}.fine{font-size:12px;color:#9f90b0}</style><script defer src="icons.js"></script><link rel="stylesheet" href="polish.css"><link rel="stylesheet" href="experience.css"></head><body><div class="shell"><header class="nav"><a class="logo" href="home.html">way<i>go.</i></a><a class="pill" href="home.html">← Späť na WayGo</a></header><main class="authwrap"><section class="authcard"><div class="eyebrow">WAYGO • TVOJE ŠTÚDIUM</div><h1>Nastav nové heslo.</h1><p>Otváraj túto stránku cez odkaz v e-maile.</p><button class="social" id="google" type="button">[[wg:globe]] Pokračovať cez Google</button><button class="social" id="apple" type="button">● Pokračovať cez Apple</button><button class="social" id="azure" type="button">▦ Pokračovať cez Microsoft</button><div class="or">— alebo e-mailom —</div><form id="authForm"><label for="password">Heslo</label><input class="field" id="password" type="password" minlength="6" required autocomplete="new-password" placeholder="••••••••"><label for="confirm">Zopakuj heslo</label><input class="field" id="confirm" type="password" required minlength="6" autocomplete="new-password"><button class="btn full" type="submit">Uložiť heslo →</button></form><div class="aux"><a href="login.html">Prihlásenie</a></div><div id="message" role="status" aria-live="polite"></div><div class="fine">Prihlásenie cez poskytovateľov vyžaduje ich aktiváciu v Supabase a nastavenie OAuth.</div></section></main></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const CFG=window.WAYGO_CONFIG||{};
const ready=!!(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase);
const db=ready?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey):null;
const $=id=>document.getElementById(id);
const status=(s,bad=false)=>{const e=$('message');e.textContent=s;e.style.color=bad?'#ff9cb1':'#cbb2ef'};
const next=()=>{const p=new URLSearchParams(location.search).get('next');return p&&/^(home|feed|account|social|vip|admin)\.html$/.test(p)?p:'home.html'};
async function social(provider){if(!db)return status('Najprv vyplň Supabase v config.js.',true);const redirectTo=new URL('auth-callback.html',location.href).href+'?next='+encodeURIComponent(next());const {error}=await db.auth.signInWithOAuth({provider,options:{redirectTo}});if(error)status(error.message,true)}
for(const p of ['google','apple','azure'])$(p).onclick=()=>social(p);
if(!ready)status('Ukážka dizajnu: na prihlásenie nastav config.js a poskytovateľov v Supabase.');
</script><script>
$('authForm').onsubmit=async e=>{e.preventDefault();if(!db)return status('Najprv nastav Supabase.',true);if($('password').value!==$('confirm').value)return status('Heslá sa nezhodujú.',true);const {error}=await db.auth.updateUser({password:$('password').value});status(error?error.message:'Heslo bolo aktualizované. Teraz sa môžeš prihlásiť.',!!error)};
</script><script src="polish.js" defer></script><script defer src="experience.js"></script></body></html>
