<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WayGo – Login</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 40%,
                    #21132f 0%,
                    #100a17 30%,
                    #050406 65%,
                    #000000 100%
                );

            color: white;

            font-family: "Montserrat", sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        /* =========================
           BACKGROUND
        ========================= */

        .glow {
            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(151, 75, 255, .15),
                    transparent 70%
                );

            filter: blur(30px);

            pointer-events: none;
        }


        /* =========================
           CARD
        ========================= */

        .container {
            position: relative;

            width: 420px;

            padding: 45px 45px 40px;

            background:
                rgba(12, 9, 17, .78);

            border:
                1px solid
                rgba(180, 120, 255, .15);

            border-radius: 24px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 80px rgba(0,0,0,.55),
                0 0 60px rgba(115,40,200,.08);

            animation:
                appear .9s cubic-bezier(.16,1,.3,1);
        }


        /* =========================
           LOGO
        ========================= */

        .mini-logo {
            text-align: center;
            margin-bottom: 35px;
        }


        .mini-wg {
            font-family: "Bodoni Moda", serif;

            font-size: 44px;

            font-style: italic;

            color: #ad6cff;

            letter-spacing: -5px;

            text-shadow:
                0 0 15px
                rgba(160,90,255,.3);
        }


        .mini-name {
            margin-top: -4px;

            font-family: "Bodoni Moda", serif;

            font-size: 23px;

            letter-spacing: 4px;

            color: white;
        }


        /* =========================
           TITLES
        ========================= */

        h1 {
            text-align: center;

            font-family: "Bodoni Moda", serif;

            font-size: 34px;

            font-weight: 400;

            margin-bottom: 8px;
        }


        .description {
            text-align: center;

            font-size: 11px;

            color:
                rgba(255,255,255,.45);

            margin-bottom: 30px;

            letter-spacing: .5px;
        }


        /* =========================
           FORMS
        ========================= */

        .form {
            display: none;
        }


        .form.active {
            display: block;

            animation:
                formAppear .45s ease;
        }


        /* =========================
           INPUT
        ========================= */

        .field {
            position: relative;
            margin-bottom: 18px;
        }


        .field label {
            display: block;

            font-size: 10px;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            color:
                rgba(255,255,255,.45);

            margin-bottom: 8px;
        }


        .field input {
            width: 100%;

            padding: 14px 15px;

            border-radius: 10px;

            border:
                1px solid
                rgba(255,255,255,.1);

            outline: none;

            background:
                rgba(255,255,255,.035);

            color: white;

            font-family: "Montserrat", sans-serif;

            font-size: 13px;

            transition:
                border-color .3s,
                box-shadow .3s,
                background .3s;
        }


        .field input::placeholder {
            color:
                rgba(255,255,255,.22);
        }


        .field input:focus {
            border-color:
                rgba(170,100,255,.65);

            background:
                rgba(150,80,255,.04);

            box-shadow:
                0 0 0 3px
                rgba(150,80,255,.08);
        }


        /* =========================
           FORGOT PASSWORD
        ========================= */

        .forgot {
            display: block;

            text-align: right;

            margin-top: -8px;
            margin-bottom: 15px;

            color:
                rgba(255,255,255,.35);

            font-size: 9px;

            text-decoration: none;

            transition: color .2s;
        }


        .forgot:hover {
            color: #b477ff;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: none;

            margin-bottom: 18px;

            padding: 11px 13px;

            border-radius: 9px;

            font-size: 10px;

            line-height: 1.5;

            text-align: center;
        }


        .message.show {
            display: block;
        }


        .message.error {
            color: #ffb5c5;

            background:
                rgba(255,70,110,.08);

            border:
                1px solid
                rgba(255,70,110,.15);
        }


        .message.success {
            color: #d4b6ff;

            background:
                rgba(150,80,255,.08);

            border:
                1px solid
                rgba(150,80,255,.15);
        }


        /* =========================
           SUBMIT
        ========================= */

        .submit {
            width: 100%;

            margin-top: 8px;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #a85cff,
                    #7135d6
                );

            color: white;

            font-family: "Montserrat", sans-serif;

            font-size: 11px;

            font-weight: 500;

            letter-spacing: 2px;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                transform .25s,
                box-shadow .25s,
                filter .25s;
        }


        .submit:hover {
            transform:
                translateY(-2px);

            filter:
                brightness(1.1);

            box-shadow:
                0 10px 30px
                rgba(130,60,230,.25);
        }


        .submit:disabled {
            opacity: .55;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* =========================
           DIVIDER
        ========================= */

        .or {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 25px 0 18px;

            color:
                rgba(255,255,255,.25);

            font-size: 9px;

            letter-spacing: 1px;

            text-transform: uppercase;
        }


        .or::before,
        .or::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(255,255,255,.08);
        }


        /* =========================
           SOCIAL BUTTONS
        ========================= */

        .socials {
            display: flex;

            justify-content: center;

            gap: 14px;
        }


        .social {
            width: 48px;
            height: 48px;

            border-radius: 50%;

            display: flex;

            justify-content: center;
            align-items: center;

            border:
                1px solid
                rgba(255,255,255,.12);

            background:
                rgba(255,255,255,.025);

            color: white;

            cursor: pointer;

            transition:
                transform .25s ease,
                border-color .25s ease,
                background .25s ease,
                box-shadow .25s ease;
        }


        .social:hover {
            transform:
                translateY(-3px)
                scale(1.04);

            border-color:
                rgba(180,110,255,.55);

            background:
                rgba(150,80,255,.06);

            box-shadow:
                0 8px 25px
                rgba(120,50,220,.18);
        }


        .social:disabled {
            opacity: .5;
            cursor: not-allowed;
        }


        .social svg {
            display: block;
        }


        /* =========================
           GOOGLE
        ========================= */

        .google-icon {
            width: 21px;
            height: 21px;
        }


        /* =========================
           APPLE
        ========================= */

        .apple-icon {
            width: 21px;
            height: 21px;

            fill: currentColor;
        }


        /* =========================
           MICROSOFT
        ========================= */

        .microsoft-icon {
            width: 19px;
            height: 19px;
        }


        /* =========================
           SWITCH
        ========================= */

        .switch {
            text-align: center;

            margin-top: 25px;

            font-size: 11px;

            color:
                rgba(255,255,255,.4);
        }


        .switch button {
            border: none;

            background: none;

            color: #b477ff;

            font-family: inherit;

            font-size: inherit;

            cursor: pointer;

            margin-left: 4px;

            transition: color .2s;
        }


        .switch button:hover {
            color: #d0a5ff;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {
            display: inline-block;

            width: 12px;
            height: 12px;

            border:
                2px solid
                rgba(255,255,255,.3);

            border-top-color: white;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;

            vertical-align: middle;

            margin-right: 7px;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes appear {

            from {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes formAppear {

            from {
                opacity: 0;

                transform:
                    translateX(10px);
            }

            to {
                opacity: 1;

                transform:
                    translateX(0);
            }
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .container {
                width:
                    calc(100% - 30px);

                padding:
                    35px 25px;
            }


            .social {
                width: 46px;
                height: 46px;
            }
        }

    </style>

</head>

    <script>

        /* =====================================================
           SUPABASE CONFIG
        ===================================================== */

        const SUPABASE_URL =
            "https://bawobcabfgzzcrbiwbmp.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_RsORCNSLMe5-oHiKlrJ3WA_g2ftZmFL";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const loginForm =
            document.getElementById("loginForm");

        const signupForm =
            document.getElementById("signupForm");


        const loginFormElement =
            document.getElementById(
                "loginFormElement"
            );

        const signupFormElement =
            document.getElementById(
                "signupFormElement"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );

        const signupButton =
            document.getElementById(
                "signupButton"
            );


        const loginMessage =
            document.getElementById(
                "loginMessage"
            );

        const signupMessage =
            document.getElementById(
                "signupMessage"
            );


        /* =====================================================
           FORM SWITCHING
        ===================================================== */

        function showLogin() {

            signupForm.classList.remove("active");

            loginForm.classList.add("active");

            clearMessages();
        }


        function showSignup() {

            loginForm.classList.remove("active");

            signupForm.classList.add("active");

            clearMessages();
        }


        /* =====================================================
           MESSAGES
        ===================================================== */

        function showMessage(
            element,
            text,
            type
        ) {

            element.textContent = text;

            element.className =
                "message show " + type;
        }


        function clearMessages() {

            loginMessage.textContent = "";

            signupMessage.textContent = "";

            loginMessage.className =
                "message";

            signupMessage.className =
                "message";
        }


        /* =====================================================
           LOGIN
        ===================================================== */

        loginFormElement.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                clearMessages();


                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("loginPassword")
                        .value;


                loginButton.disabled = true;

                loginButton.innerHTML =
                    '<span class="loading"></span>Signing in';


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .signInWithPassword({

                            email: email,

                            password: password

                        });


                if (error) {

                    showMessage(
                        loginMessage,
                        getFriendlyError(error),
                        "error"
                    );

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Sign in";

                    return;
                }


                if (data.session) {

                    showMessage(
                        loginMessage,
                        "Welcome back. Redirecting...",
                        "success"
                    );


                    setTimeout(() => {

                        window.location.href =
                            "home.html";

                    }, 700);

                }

            }
        );


        /* =====================================================
           SIGN UP
        ===================================================== */

        signupFormElement.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                clearMessages();


                const name =
                    document
                        .getElementById("signupName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("signupEmail")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("signupPassword")
                        .value;


                if (name.length < 2) {

                    showMessage(
                        signupMessage,
                        "Please enter your name.",
                        "error"
                    );

                    return;
                }


                if (password.length < 6) {

                    showMessage(
                        signupMessage,
                        "Password must contain at least 6 characters.",
                        "error"
                    );

                    return;
                }


                signupButton.disabled = true;

                signupButton.innerHTML =
                    '<span class="loading"></span>Creating';


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .signUp({

                            email: email,

                            password: password,

                            options: {

                                data: {

                                    full_name: name

                                },

                                emailRedirectTo:
                                    window.location.origin +
                                    "/login.html"

                            }

                        });


                if (error) {

                    showMessage(
                        signupMessage,
                        getFriendlyError(error),
                        "error"
                    );

                    signupButton.disabled = false;

                    signupButton.textContent =
                        "Create account";

                    return;
                }


                /*
                 * Email confirmation enabled
                 */

                if (
                    data.user &&
                    !data.session
                ) {

                    showMessage(
                        signupMessage,
                        "Account created! Check your email to verify your account.",
                        "success"
                    );


                    signupButton.disabled = false;

                    signupButton.textContent =
                        "Create account";

                    return;
                }


                /*
                 * Email confirmation disabled
                 */

                if (data.session) {

                    showMessage(
                        signupMessage,
                        "Account created. Redirecting...",
                        "success"
                    );


                    setTimeout(() => {

                        window.location.href =
                            "home.html";

                    }, 700);

                }

            }
        );


        /* =====================================================
           FORGOT PASSWORD
        ===================================================== */

        document
            .getElementById("forgotPassword")
            .addEventListener(
                "click",
                async function(event) {

                    event.preventDefault();


                    const email =
                        document
                            .getElementById("loginEmail")
                            .value
                            .trim();


                    if (!email) {

                        showMessage(
                            loginMessage,
                            "Enter your email address first.",
                            "error"
                        );

                        return;
                    }


                    const {
                        error
                    } =
                        await supabaseClient.auth
                            .resetPasswordForEmail(
                                email,
                                {

                                    redirectTo:
                                        window.location.origin +
                                        "/reset-password.html"

                                }
                            );


                    if (error) {

                        showMessage(
                            loginMessage,
                            getFriendlyError(error),
                            "error"
                        );

                        return;
                    }


                    showMessage(
                        loginMessage,
                        "Password reset email sent. Check your inbox.",
                        "success"
                    );

                }
            );


        /* =====================================================
           GOOGLE
        ===================================================== */

        async function signInWithGoogle() {

            const {
                error
            } =
                await supabaseClient.auth
                    .signInWithOAuth({

                        provider: "google",

                        options: {

                            redirectTo:
                                window.location.origin +
                                "/home.html"

                        }

                    });


            if (error) {

                showMessage(
                    loginMessage,
                    getFriendlyError(error),
                    "error"
                );

            }
        }


        /* =====================================================
           APPLE
        ===================================================== */

        async function signInWithApple() {

            const {
                error
            } =
                await supabaseClient.auth
                    .signInWithOAuth({

                        provider: "apple",

                        options: {

                            redirectTo:
                                window.location.origin +
                                "/home.html"

                        }

                    });


            if (error) {

                showMessage(
                    loginMessage,
                    getFriendlyError(error),
                    "error"
                );

            }
        }


        /* =====================================================
           MICROSOFT
        ===================================================== */

        async function signInWithMicrosoft() {

            const {
                error
            } =
                await supabaseClient.auth
                    .signInWithOAuth({

                        provider: "azure",

                        options: {

                            scopes: "email",

                            redirectTo:
                                window.location.origin +
                                "/home.html"

                        }

                    });


            if (error) {

                showMessage(
                    loginMessage,
                    getFriendlyError(error),
                    "error"
                );

            }
        }


        /* =====================================================
           EXISTING SESSION
        ===================================================== */

        async function checkSession() {

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .getSession();


            if (error) {

                console.error(
                    "Session error:",
                    error
                );

                return;
            }


            if (data.session) {

                window.location.href =
                    "home.html";
            }
        }


        /* =====================================================
           AUTH STATE
        ===================================================== */

        supabaseClient.auth
            .onAuthStateChange(
                (event, session) => {

                    if (
                        event === "SIGNED_IN" &&
                        session
                    ) {

                        /*
                         * OAuth login can arrive here.
                         */

                        if (
                            !window.location.pathname
                                .endsWith("home.html")
                        ) {

                            window.location.href =
                                "home.html";
                        }

                    }

                }
            );


        /* =====================================================
           FRIENDLY ERRORS
        ===================================================== */

        function getFriendlyError(error) {

            const message =
                error?.message || "";


            if (
                message
                    .toLowerCase()
                    .includes("invalid login credentials")
            ) {

                return "Incorrect email or password.";
            }


            if (
                message
                    .toLowerCase()
                    .includes("user already registered")
            ) {

                return "An account with this email already exists.";
            }


            if (
                message
                    .toLowerCase()
                    .includes("email not confirmed")
            ) {

                return "Please confirm your email before signing in.";
            }


            if (
                message
                    .toLowerCase()
                    .includes("password should be at least")
            ) {

                return "Your password is too short.";
            }


            return message ||
                "Something went wrong. Please try again.";
        }


        /* =====================================================
           START
        ===================================================== */

        checkSession();

    </script>

</body>

</html>
