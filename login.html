<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>wayGo — Prihlásenie</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at 50% 50%, #24104d, #0b0522 45%, #030014 85%);
        }

        #space {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: twinkle ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from {
                opacity: .2;
                transform: scale(.7);
            }

            to {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .login-box {
            position: relative;
            z-index: 5;

            width: min(90%, 420px);
            padding: 40px;

            text-align: center;

            background: rgba(10, 5, 30, .82);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 28px;

            box-shadow:
                0 0 35px rgba(124,77,255,.25),
                0 0 80px rgba(34,211,238,.08);

            backdrop-filter: blur(10px);

            animation: appear .7s ease-out;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: -4px;
            margin-bottom: 8px;

            text-shadow:
                0 0 10px #8b5cf6,
                0 0 25px #6366f1;
        }

        .logo span {
            color: #22d3ee;

            text-shadow:
                0 0 10px #22d3ee,
                0 0 25px #22d3ee;
        }

        .subtitle {
            color: #aaa8c4;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 14px;

            border: 1px solid rgba(255,255,255,.1);
            border-radius: 14px;

            outline: none;

            color: white;
            background: rgba(255,255,255,.07);

            font-size: 15px;
        }

        input:focus {
            border-color: #22d3ee;
            box-shadow: 0 0 15px rgba(34,211,238,.2);
        }

        input::placeholder {
            color: #77738e;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 8px;

            border: none;
            border-radius: 14px;

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            background: linear-gradient(
                90deg,
                #7c3aed,
                #2563eb,
                #06b6d4
            );

            box-shadow: 0 0 20px rgba(99,102,241,.35);

            transition: .2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(34,211,238,.45);
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #message {
            min-height: 22px;
            margin-top: 18px;
            font-size: 14px;
        }

        .error {
            color: #ff6b9d;
        }

        .success {
            color: #4ade80;
        }

        .register {
            margin-top: 22px;
            color: #88849e;
            font-size: 14px;
        }

        .register a {
            color: #22d3ee;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div id="space"></div>

    <div class="login-box">

        <div class="logo">
            way<span>Go</span>
        </div>

        <p class="subtitle">
            🌌 Tvoja cesta za poznaním
        </p>

        <h2>Vitaj späť 🚀</h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Heslo"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                🚀 Prihlásiť sa
            </button>

        </form>

        <div id="message"></div>

        <div class="register">
            Nemáš ešte účet?
            <a href="register.html">Zaregistruj sa</a>
        </div>

    </div>


    <script>

        // =====================================
        // SUPABASE
        // =====================================

        const SUPABASE_URL =
            "https://uteqhopuobkuzbrytbgw.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_lEGoAcY4kSW8NSNoNihoiw_0KGnlvbo";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // =====================================
        // LOGIN
        // =====================================

        const form =
            document.getElementById("loginForm");

        const button =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            button.disabled = true;
            button.textContent = "🚀 Prihlasujem...";

            message.textContent = "";
            message.className = "";


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                console.error(error);

                message.textContent =
                    "❌ Nesprávny email alebo heslo.";

                message.className = "error";

                button.disabled = false;
                button.textContent = "🚀 Prihlásiť sa";

                return;
            }


            message.textContent =
                "✨ Vitaj vo wayGo!";

            message.className = "success";


            setTimeout(() => {
                window.location.href = "home.html";
            }, 700);

        });


        // =====================================
        // NÁHODNÉ HVIEZDY
        // =====================================

        const space =
            document.getElementById("space");

        for (let i = 0; i < 80; i++) {

            const star =
                document.createElement("div");

            star.className = "star";

            const size =
                Math.random() * 2.5 + .5;

            star.style.width = size + "px";
            star.style.height = size + "px";

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            star.style.animationDuration =
                Math.random() * 3 + 1.5 + "s";

            star.style.animationDelay =
                Math.random() * 3 + "s";

            space.appendChild(star);
        }

    </script>

</body>
</html>
