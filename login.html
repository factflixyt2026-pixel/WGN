<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wago — Login</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          rgba(126, 34, 206, 0.22),
          transparent 40%
        ),
        #030205;

      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    .glow {
      position: fixed;

      width: 450px;
      height: 450px;

      border-radius: 50%;

      background: #7c3aed;

      filter: blur(160px);

      opacity: .13;

      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 2;

      width: 430px;
      max-width: 92%;
    }

    /* =========================
       TOGGLE
    ========================= */

    .toggle {
      position: relative;

      display: flex;

      width: 230px;
      height: 48px;

      margin: 0 auto 18px;

      padding: 4px;

      border-radius: 14px;

      background: rgba(255,255,255,.055);

      border: 1px solid rgba(255,255,255,.08);
    }

    .toggle-slider {
      position: absolute;

      top: 4px;
      left: 4px;

      width: calc(50% - 4px);
      height: 38px;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #6d28d9,
          #9333ea
        );

      transition:
        transform .35s cubic-bezier(.65,0,.35,1);
    }

    .toggle.signup .toggle-slider {
      transform: translateX(100%);
    }

    .toggle button {
      position: relative;
      z-index: 2;

      width: 50%;

      border: none;
      background: transparent;

      color: #817987;

      font-size: 12px;
      font-weight: 800;

      cursor: pointer;

      transition: .25s;
    }

    .toggle button.active {
      color: white;
    }

    /* =========================
       WINDOW
    ========================= */

    .window {
      width: 100%;

      padding: 42px;

      border-radius: 24px;

      background:
        rgba(10,7,15,.94);

      border:
        1px solid rgba(255,255,255,.08);

      box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        0 0 50px rgba(124,58,237,.08);

      backdrop-filter: blur(20px);
    }

    .form {
      animation: formIn .4s ease;
    }

    @keyframes formIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand {
      color: #a855f7;

      font-size: 13px;
      font-weight: 900;

      letter-spacing: 3px;

      margin-bottom: 17px;
    }

    h1 {
      font-size: 36px;

      letter-spacing: -1.7px;

      margin-bottom: 10px;
    }

    .subtitle {
      color: #77717f;

      font-size: 14px;

      line-height: 1.6;

      margin-bottom: 28px;
    }

    /* =========================
       INPUTS
    ========================= */

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;

      margin-bottom: 8px;

      color: #aaa2b2;

      font-size: 12px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      height: 51px;

      padding: 0 15px;

      border-radius: 12px;

      border:
        1px solid rgba(255,255,255,.08);

      outline: none;

      background:
        rgba(255,255,255,.045);

      color: white;

      font-size: 14px;

      transition: .25s;
    }

    .field input::placeholder {
      color: #514b58;
    }

    .field input:focus {
      border-color: #9333ea;

      background:
        rgba(147,51,234,.06);

      box-shadow:
        0 0 0 3px rgba(147,51,234,.08);
    }

    /* =========================
       PRIMARY BUTTON
    ========================= */

    .primary {
      width: 100%;
      height: 51px;

      margin-top: 5px;

      border: none;
      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #6d28d9,
          #9333ea,
          #a855f7
        );

      color: white;

      font-size: 14px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 10px 25px rgba(124,58,237,.25);

      transition: .25s;
    }

    .primary:hover {
      transform: translateY(-2px);

      box-shadow:
        0 15px 35px rgba(124,58,237,.38);
    }

    /* =========================
       DIVIDER
    ========================= */

    .divider {
      display: flex;
      align-items: center;

      gap: 12px;

      margin: 24px 0;

      color: #514b58;

      font-size: 10px;
      font-weight: 700;
    }

    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background:
        rgba(255,255,255,.07);
    }

    /* =========================
       SOCIAL BUTTONS
    ========================= */

    .social-buttons {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    .social {
      height: 48px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 9px;

      border-radius: 12px;

      border:
        1px solid rgba(255,255,255,.09);

      background:
        rgba(255,255,255,.035);

      color: white;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      transition: .25s;
    }

    .social:hover {
      background:
        rgba(255,255,255,.08);

      border-color:
        rgba(168,85,247,.45);

      transform: translateY(-1px);
    }

    .google-icon {
      color: #4285F4;

      font-size: 17px;
      font-weight: 900;
    }

    .apple-icon {
      color: white;

      font-size: 18px;
    }

    /* =========================
       MESSAGE
    ========================= */

    #message {
      min-height: 20px;

      margin-top: 17px;

      text-align: center;

      font-size: 12px;

      color: #a855f7;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 18px;

      text-align: center;

      color: #625c69;

      font-size: 12px;
    }

    .footer span {
      color: #a855f7;

      cursor: pointer;
    }

    @media (max-width: 500px) {
      .window {
        padding: 32px 25px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <div class="wrapper">

    <!-- LOGIN / SIGN UP TOGGLE -->

    <div class="toggle" id="toggle">

      <div class="toggle-slider"></div>

      <button
        id="loginTab"
        class="active"
        onclick="showLogin()"
      >
        LOGIN
      </button>

      <button
        id="signupTab"
        onclick="showSignup()"
      >
        SIGN UP
      </button>

    </div>


    <!-- MAIN WINDOW -->

    <div class="window">

      <div id="formContainer"></div>

      <div id="message"></div>

    </div>

  </div>


  <script>

    /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://ajpwzvrwoaobrmwjxemb.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_7i4FK4GUMVWKeH3Clj4kKA_Wd6uNVlZ";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================
       ELEMENTS
    ===================================== */

    const toggle =
      document.getElementById("toggle");

    const loginTab =
      document.getElementById("loginTab");

    const signupTab =
      document.getElementById("signupTab");

    const formContainer =
      document.getElementById("formContainer");

    const message =
      document.getElementById("message");


    /* =====================================
       LOGIN SCREEN
    ===================================== */

    function showLogin() {

      toggle.classList.remove("signup");

      loginTab.classList.add("active");
      signupTab.classList.remove("active");

      message.textContent = "";

      formContainer.innerHTML = `

        <div class="form">

          <div class="brand">
            WAGO
          </div>

          <h1>
            Welcome back.
          </h1>

          <p class="subtitle">
            Sign in to your Wago account
            and continue your journey.
          </p>


          <form onsubmit="login(event)">

            <div class="field">

              <label>
                Email
              </label>

              <input
                id="loginEmail"
                type="email"
                placeholder="you@example.com"
                required
              >

            </div>


            <div class="field">

              <label>
                Password
              </label>

              <input
                id="loginPassword"
                type="password"
                placeholder="Your password"
                required
              >

            </div>


            <button
              class="primary"
              type="submit"
            >
              Sign in
            </button>

          </form>


          <div class="divider">
            OR CONTINUE WITH
          </div>


          <div class="social-buttons">

            <button
              class="social"
              onclick="loginWithGoogle()"
            >
              <span class="google-icon">
                G
              </span>

              Google
            </button>


            <button
              class="social"
              onclick="loginWithApple()"
            >
              <span class="apple-icon">
                
              </span>

              Apple
            </button>

          </div>


          <div class="footer">

            New to Wago?

            <span onclick="showSignup()">
              Create an account
            </span>

          </div>

        </div>

      `;
    }


    /* =====================================
       SIGN UP SCREEN
    ===================================== */

    function showSignup() {

      toggle.classList.add("signup");

      loginTab.classList.remove("active");
      signupTab.classList.add("active");

      message.textContent = "";

      formContainer.innerHTML = `

        <div class="form">

          <div class="brand">
            WAGO
          </div>

          <h1>
            Create account.
          </h1>

          <p class="subtitle">
            Join Wago and start your journey
            today.
          </p>


          <form onsubmit="signup(event)">

            <div class="field">

              <label>
                Name
              </label>

              <input
                id="signupName"
                type="text"
                placeholder="Your name"
                required
              >

            </div>


            <div class="field">

              <label>
                Email
              </label>

              <input
                id="signupEmail"
                type="email"
                placeholder="you@example.com"
                required
              >

            </div>


            <div class="field">

              <label>
                Password
              </label>

              <input
                id="signupPassword"
                type="password"
                placeholder="Create a password"
                minlength="6"
                required
              >

            </div>


            <button
              class="primary"
              type="submit"
            >
              Create account
            </button>

          </form>


          <div class="divider">
            OR CONTINUE WITH
          </div>


          <div class="social-buttons">

            <button
              class="social"
              onclick="loginWithGoogle()"
            >
              <span class="google-icon">
                G
              </span>

              Google
            </button>


            <button
              class="social"
              onclick="loginWithApple()"
            >
              <span class="apple-icon">
                
              </span>

              Apple
            </button>

          </div>


          <div class="footer">

            Already have an account?

            <span onclick="showLogin()">
              Sign in
            </span>

          </div>

        </div>

      `;
    }


    /* =====================================
       EMAIL LOGIN
    ===================================== */

    async function login(event) {

      event.preventDefault();

      message.textContent =
        "Signing you in...";

      const email =
        document.getElementById(
          "loginEmail"
        ).value;

      const password =
        document.getElementById(
          "loginPassword"
        ).value;


      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({
            email: email,
            password: password
          });


      if (error) {

        message.textContent =
          error.message;

        return;
      }


      message.textContent =
        "Login successful!";


      /*
        Change this to the page
        you want after login.
      */

      window.location.href =
        "main.html";
    }


    /* =====================================
       EMAIL SIGN UP
    ===================================== */

    async function signup(event) {

      event.preventDefault();

      message.textContent =
        "Creating your account...";


      const name =
        document.getElementById(
          "signupName"
        ).value;

      const email =
        document.getElementById(
          "signupEmail"
        ).value;

      const password =
        document.getElementById(
          "signupPassword"
        ).value;


      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signUp({

            email: email,

            password: password,

            options: {

              data: {
                full_name: name
              },

              /*
                After email verification,
                Supabase sends the user here.
              */

              emailRedirectTo:
                window.location.origin +
                "/home.html"
            }

          });


      if (error) {

        message.textContent =
          error.message;

        return;
      }


      /*
        If email confirmation is enabled,
        the user needs to confirm their email.
      */

      if (!data.session) {

        message.textContent =
          "Account created! Check your email to verify your account.";

        return;
      }


      message.textContent =
        "Account created!";


      window.location.href =
        "home.html";
    }


    /* =====================================
       GOOGLE LOGIN
    ===================================== */

    async function loginWithGoogle() {

      message.textContent =
        "Connecting to Google...";


      const {
        error
      } =
        await supabaseClient.auth
          .signInWithOAuth({

            provider: "google",

            options: {

              redirectTo:
                window.location.origin +
                "/home.html"

            }

          });


      if (error) {

        message.textContent =
          error.message;
      }
    }


    /* =====================================
       APPLE LOGIN
    ===================================== */

    async function loginWithApple() {

      message.textContent =
        "Connecting to Apple...";


      const {
        error
      } =
        await supabaseClient.auth
          .signInWithOAuth({

            provider: "apple",

            options: {

              redirectTo:
                window.location.origin +
                "/home.html"

            }

          });


      if (error) {

        message.textContent =
          error.message;
      }
    }


    /* =====================================
       CHECK EXISTING SESSION
    ===================================== */

    supabaseClient.auth
      .getSession()
      .then(({ data }) => {

        if (data.session) {

          window.location.href =
            "home.html";
        }

      });


    /* =====================================
       START WITH LOGIN
    ===================================== */

    showLogin();

  </script>

</body>
</html>
