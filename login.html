<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wago — Login</title>


  <!-- Supabase JS -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {

      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at center,
          rgba(126, 34, 206, 0.23),
          transparent 42%
        ),
        #030205;

      overflow: hidden;
    }


    /* =========================
       PURPLE GLOW
    ========================= */

    .glow {

      position: fixed;

      width: 480px;
      height: 480px;

      border-radius: 50%;

      background: #7c3aed;

      filter: blur(170px);

      opacity: .13;

      pointer-events: none;

      animation:
        glowPulse 4s ease-in-out infinite alternate;
    }


    @keyframes glowPulse {

      from {
        transform: scale(.85);
        opacity: .08;
      }

      to {
        transform: scale(1.15);
        opacity: .17;
      }

    }


    /* =========================
       WRAPPER
    ========================= */

    .wrapper {

      position: relative;

      z-index: 2;

      width: 430px;

      max-width: 92%;
    }


    /* =========================
       LOGIN / SIGN UP TOGGLE
    ========================= */

    .toggle {

      position: relative;

      display: flex;

      width: 230px;

      height: 48px;

      margin:
        0 auto
        18px;

      padding: 4px;

      border-radius: 14px;

      background:
        rgba(255,255,255,.055);

      border:
        1px solid
        rgba(255,255,255,.08);

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.25);
    }


    .toggle-slider {

      position: absolute;

      top: 4px;
      left: 4px;

      width:
        calc(50% - 4px);

      height: 38px;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #6d28d9,
          #9333ea
        );

      box-shadow:
        0 5px 18px
        rgba(124,58,237,.35);

      transition:
        transform
        .35s
        cubic-bezier(.65,0,.35,1);
    }


    .toggle.signup
    .toggle-slider {

      transform:
        translateX(100%);
    }


    .toggle button {

      position: relative;

      z-index: 2;

      width: 50%;

      border: none;

      background: transparent;

      color: #817987;

      font-size: 12px;

      font-weight: 800;

      letter-spacing: .5px;

      cursor: pointer;

      transition: .25s;
    }


    .toggle button.active {

      color: white;
    }


    /* =========================
       MAIN WINDOW
    ========================= */

    .window {

      width: 100%;

      min-height: 560px;

      padding: 42px;

      border-radius: 26px;

      background:
        rgba(10,7,15,.94);

      border:
        1px solid
        rgba(255,255,255,.08);

      box-shadow:

        0 30px 90px
        rgba(0,0,0,.58),

        0 0 60px
        rgba(124,58,237,.08);

      backdrop-filter:
        blur(22px);

      overflow: hidden;
    }


    /* =========================
       FORM ANIMATION
    ========================= */

    .form {

      animation:
        formIn
        .4s
        ease;
    }


    @keyframes formIn {

      from {

        opacity: 0;

        transform:
          translateY(12px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    /* =========================
       BRAND
    ========================= */

    .brand {

      color: #a855f7;

      font-size: 13px;

      font-weight: 900;

      letter-spacing: 3px;

      margin-bottom: 17px;
    }


    h1 {

      font-size: 36px;

      letter-spacing: -1.7px;

      margin-bottom: 10px;
    }


    .subtitle {

      color: #77717f;

      font-size: 14px;

      line-height: 1.6;

      margin-bottom: 29px;
    }


    /* =========================
       INPUTS
    ========================= */

    .field {

      margin-bottom: 16px;
    }


    .field label {

      display: block;

      margin-bottom: 8px;

      color: #aaa2b2;

      font-size: 12px;

      font-weight: 600;
    }


    .field input {

      width: 100%;

      height: 51px;

      padding:
        0 15px;

      border-radius: 12px;

      border:
        1px solid
        rgba(255,255,255,.08);

      outline: none;

      background:
        rgba(255,255,255,.045);

      color: white;

      font-size: 14px;

      transition: .25s;
    }


    .field input::placeholder {

      color: #514b58;
    }


    .field input:focus {

      border-color:
        #9333ea;

      background:
        rgba(147,51,234,.06);

      box-shadow:
        0 0 0 3px
        rgba(147,51,234,.08);
    }


    /* =========================
       PRIMARY BUTTON
    ========================= */

    .primary {

      width: 100%;

      height: 51px;

      margin-top: 6px;

      border: none;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #6d28d9,
          #9333ea,
          #a855f7
        );

      color: white;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 10px 28px
        rgba(124,58,237,.25);

      transition: .25s;
    }


    .primary:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 15px 35px
        rgba(124,58,237,.38);
    }


    .primary:active {

      transform:
        scale(.98);
    }


    /* =========================
       DIVIDER
    ========================= */

    .divider {

      display: flex;

      align-items: center;

      gap: 12px;

      margin:
        24px 0;

      color: #514b58;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: .5px;
    }


    .divider::before,
    .divider::after {

      content: "";

      flex: 1;

      height: 1px;

      background:
        rgba(255,255,255,.07);
    }


    /* =========================
       SOCIAL BUTTONS
    ========================= */

    .social-buttons {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;
    }


    .social {

      height: 48px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

      border-radius: 12px;

      border:
        1px solid
        rgba(255,255,255,.09);

      background:
        rgba(255,255,255,.035);

      color: white;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;

      transition: .25s;
    }


    .social:hover {

      background:
        rgba(255,255,255,.08);

      border-color:
        rgba(168,85,247,.45);

      transform:
        translateY(-1px);
    }


    .google-icon {

      color:
        #4285F4;

      font-size: 17px;

      font-weight: 900;
    }


    .apple-icon {

      color: white;

      font-size: 18px;
    }


    /* =========================
       MESSAGE
    ========================= */

    #message {

      min-height: 20px;

      margin-top: 17px;

      text-align: center;

      font-size: 12px;

      color: #a855f7;

      line-height: 1.5;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {

      margin-top: 18px;

      text-align: center;

      color: #625c69;

      font-size: 12px;
    }


    .footer span {

      color: #a855f7;

      cursor: pointer;

      transition: .2s;
    }


    .footer span:hover {

      color:
        #c084fc;
    }


    /* =========================
       LOADING
    ========================= */

    .loading {

      pointer-events: none;

      opacity: .65;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

      .wrapper {

        width: 94%;
      }


      .window {

        padding:
          32px 25px;

        min-height:
          540px;
      }


      h1 {

        font-size:
          32px;
      }

    }

  </style>

</head>


<body>


  <div class="glow"></div>


  <div class="wrapper">


    <!-- =========================
         LOGIN / SIGN UP TOGGLE
    ========================= -->

    <div
      class="toggle"
      id="toggle"
    >

      <div
        class="toggle-slider"
      ></div>


      <button
        id="loginTab"
        class="active"
        onclick="showLogin()"
      >
        LOGIN
      </button>


      <button
        id="signupTab"
        onclick="showSignup()"
      >
        SIGN UP
      </button>

    </div>


    <!-- =========================
         MAIN WINDOW
    ========================= -->

    <div class="window">

      <div
        id="formContainer"
      ></div>


      <div
        id="message"
      ></div>

    </div>


  </div>


  <script>

    /* =====================================
       SUPABASE CONFIG
    ===================================== */

    const SUPABASE_URL =
      "https://ajpwzvrwoaobrmwjxemb.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_7i4FK4GUMVWKeH3Clj4kKA_Wd6uNVlZ";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================
       ELEMENTS
    ===================================== */

    const toggle =
      document.getElementById(
        "toggle"
      );

    const loginTab =
      document.getElementById(
        "loginTab"
      );

    const signupTab =
      document.getElementById(
        "signupTab"
      );

    const formContainer =
      document.getElementById(
        "formContainer"
      );

    const message =
      document.getElementById(
        "message"
      );


    /* =====================================
       MESSAGE
    ===================================== */

    function showMessage(
      text,
      color = "#a855f7"
    ) {

      message.textContent = text;

      message.style.color = color;
    }


    /* =====================================
       LOGIN SCREEN
    ===================================== */

    function showLogin() {

      toggle.classList.remove(
        "signup"
      );


      loginTab.classList.add(
        "active"
      );

      signupTab.classList.remove(
        "active"
      );


      message.textContent = "";


      formContainer.innerHTML = `

        <div class="form">

          <div class="brand">
            WAGO
          </div>


          <h1>
            Welcome back.
          </h1>


          <p class="subtitle">
            Sign in to your Wago account
            and continue your journey.
          </p>


          <form
            onsubmit="login(event)"
          >

            <div class="field">

              <label>
                Email
              </label>

              <input
                id="loginEmail"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              >

            </div>


            <div class="field">

              <label>
                Password
              </label>

              <input
                id="loginPassword"
                type="password"
                placeholder="Your password"
                autocomplete="current-password"
                required
              >

            </div>


            <button
              class="primary"
              id="loginButton"
              type="submit"
            >
              Sign in
            </button>

          </form>


          <div class="divider">
            OR CONTINUE WITH
          </div>


          <div class="social-buttons">

            <button
              class="social"
              onclick="loginWithGoogle()"
            >

              <span
                class="google-icon"
              >
                G
              </span>

              Google

            </button>


            <button
              class="social"
              onclick="loginWithApple()"
            >

              <span
                class="apple-icon"
              >
                
              </span>

              Apple

            </button>

          </div>


          <div class="footer">

            New to Wago?

            <span
              onclick="showSignup()"
            >
              Create an account
            </span>

          </div>

        </div>

      `;
    }


    /* =====================================
       SIGN UP SCREEN
    ===================================== */

    function showSignup() {

      toggle.classList.add(
        "signup"
      );


      loginTab.classList.remove(
        "active"
      );

      signupTab.classList.add(
        "active"
      );


      message.textContent = "";


      formContainer.innerHTML = `

        <div class="form">

          <div class="brand">
            WAGO
          </div>


          <h1>
            Create account.
          </h1>


          <p class="subtitle">
            Join Wago and start your
            journey today.
          </p>


          <form
            onsubmit="signup(event)"
          >

            <div class="field">

              <label>
                Name
              </label>

              <input
                id="signupName"
                type="text"
                placeholder="Your name"
                autocomplete="name"
                required
              >

            </div>


            <div class="field">

              <label>
                Email
              </label>

              <input
                id="signupEmail"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              >

            </div>


            <div class="field">

              <label>
                Password
              </label>

              <input
                id="signupPassword"
                type="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="6"
                required
              >

            </div>


            <button
              class="primary"
              id="signupButton"
              type="submit"
            >
              Create account
            </button>

          </form>


          <div class="divider">
            OR CONTINUE WITH
          </div>


          <div class="social-buttons">

            <button
              class="social"
              onclick="loginWithGoogle()"
            >

              <span
                class="google-icon"
              >
                G
              </span>

              Google

            </button>


            <button
              class="social"
              onclick="loginWithApple()"
            >

              <span
                class="apple-icon"
              >
                
              </span>

              Apple

            </button>

          </div>


          <div class="footer">

            Already have an account?

            <span
              onclick="showLogin()"
            >
              Sign in
            </span>

          </div>

        </div>

      `;
    }


    /* =====================================
       REDIRECT AFTER AUTH
    ===================================== */

    async function redirectAfterAuth() {

      showMessage(
        "Checking your account..."
      );


      const {
        data,
        error
      } =
        await supabaseClient.auth
          .getUser();


      if (error || !data.user) {

        console.error(error);

        showMessage(
          "We couldn't verify your account.",
          "#ef4444"
        );

        return;
      }


      const user =
        data.user;


      /* =================================
         FIND PROFILE
      ================================= */

      let {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "has_completed_onboarding"
          )
          .eq("id", user.id)
          .maybeSingle();


      /* =================================
         PROFILE DOES NOT EXIST
      ================================= */

      if (
        !profile &&
        !profileError
      ) {

        const {
          data: newProfile,
          error: createError
        } =
          await supabaseClient
            .from("profiles")
            .insert({

              id: user.id,

              has_completed_onboarding:
                false

            })
            .select()
            .single();


        if (createError) {

          console.error(
            createError
          );

          showMessage(
            "Could not create your profile.",
            "#ef4444"
          );

          return;
        }


        profile =
          newProfile;
      }


      /* =================================
         PROFILE ERROR
      ================================= */

      if (profileError) {

        console.error(
          profileError
        );

        showMessage(
          "Could not load your profile.",
          "#ef4444"
        );

        return;
      }


      /* =================================
         FIRST TIME
      ================================= */

      if (
        !profile.has_completed_onboarding
      ) {

        window.location.href =
          "main.html";

        return;
      }


      /* =================================
         RETURNING USER
      ================================= */

      window.location.href =
        "home.html";
    }


    /* =====================================
       EMAIL LOGIN
    ===================================== */

    async function login(event) {

      event.preventDefault();


      const email =
        document.getElementById(
          "loginEmail"
        ).value.trim();


      const password =
        document.getElementById(
          "loginPassword"
        ).value;


      showMessage(
        "Signing you in..."
      );


      const button =
        document.getElementById(
          "loginButton"
        );


      if (button) {

        button.disabled =
          true;

        button.classList.add(
          "loading"
        );

      }


      const {
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email,
            password

          });


      if (error) {

        showMessage(
          error.message,
          "#ef4444"
        );


        if (button) {

          button.disabled =
            false;

          button.classList.remove(
            "loading"
          );

        }

        return;
      }


      await redirectAfterAuth();
    }


    /* =====================================
       EMAIL SIGN UP
    ===================================== */

    async function signup(event) {

      event.preventDefault();


      const name =
        document.getElementById(
          "signupName"
        ).value.trim();


      const email =
        document.getElementById(
          "signupEmail"
        ).value.trim();


      const password =
        document.getElementById(
          "signupPassword"
        ).value;


      showMessage(
        "Creating your account..."
      );


      const button =
        document.getElementById(
          "signupButton"
        );


      if (button) {

        button.disabled =
          true;

        button.classList.add(
          "loading"
        );

      }


      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signUp({

            email,

            password,

            options: {

              data: {

                full_name:
                  name

              },

              emailRedirectTo:
                window.location.origin +
                "/login.html"

            }

          });


      if (error) {

        showMessage(
          error.message,
          "#ef4444"
        );


        if (button) {

          button.disabled =
            false;

          button.classList.remove(
            "loading"
          );

        }

        return;
      }


      /*
        Email confirmation enabled
      */

      if (!data.session) {

        showMessage(
          "Account created! Check your email to verify your account.",
          "#a855f7"
        );

        return;
      }


      /*
        If Supabase immediately
        created a session.
      */

      await redirectAfterAuth();
    }


    /* =====================================
       GOOGLE
    ===================================== */

    async function loginWithGoogle() {

      showMessage(
        "Connecting to Google..."
      );


      const {
        error
      } =
        await supabaseClient.auth
          .signInWithOAuth({

            provider:
              "google",

            options: {

              redirectTo:
                window.location.origin +
                "/login.html"

            }

          });


      if (error) {

        showMessage(
          error.message,
          "#ef4444"
        );
      }
    }


    /* =====================================
       APPLE
    ===================================== */

    async function loginWithApple() {

      showMessage(
        "Connecting to Apple..."
      );


      const {
        error
      } =
        await supabaseClient.auth
          .signInWithOAuth({

            provider:
              "apple",

            options: {

              redirectTo:
                window.location.origin +
                "/login.html"

            }

          });


      if (error) {

        showMessage(
          error.message,
          "#ef4444"
        );
      }
    }


    /* =====================================
       CHECK SESSION
    ===================================== */

    async function checkSession() {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .getSession();


      if (error) {

        console.error(error);

        return;
      }


      /*
        User returned from Google/Apple
        or already has an active session.
      */

      if (data.session) {

        await redirectAfterAuth();

      }

    }


    /* =====================================
       AUTH STATE CHANGES
    ===================================== */

    supabaseClient.auth
      .onAuthStateChange(
        async (event, session) => {

          if (
            event ===
              "SIGNED_IN" &&
            session
          ) {

            /*
              Small delay prevents
              race conditions after OAuth.
            */

            setTimeout(
              () => {
                redirectAfterAuth();
              },
              100
            );

          }

        }
      );


    /* =====================================
       START
    ===================================== */

    showLogin();

    checkSession();

  </script>

</body>

</html>
