
<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080713">
<title>Úspech · WayGo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background: #080713;
    color: white;
    font-family: 'Inter', sans-serif;
}

#app {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 25px;

    background:
        radial-gradient(ellipse at 50% 45%, #7535c744, transparent 45%),
        radial-gradient(circle at 15% 85%, #007bff22, transparent 35%),
        #080713;
}

.success {
    width: 100%;
    max-width: 430px;
    text-align: center;
    padding: 45px 28px;
    border-radius: 30px;
    background: #171126bb;
    border: 1px solid #ffffff18;
    backdrop-filter: blur(25px);
    box-shadow: 0 0 80px #8b35ff22;
    animation: appear .9s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px) scale(.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.logo {
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 5px;
    margin-bottom: 45px;
    color: #d8b4fe;
}

.logo span {
    color: #8c6bff;
}

.icon-wrap {
    width: 115px;
    height: 115px;
    border-radius: 35px;
    margin: 0 auto 30px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg,#a855f7,#6538ff,#00c8ff);
    box-shadow:
        0 0 30px #a855f766,
        0 0 80px #7535ff44;
    animation: pulse 2.5s infinite ease-in-out;
}

.check {
    font-size: 58px;
    font-weight: 800;
    color: white;
}

@keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}

h1 {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 15px;
    background: linear-gradient(90deg,#fff,#d8b4fe,#73d8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.description {
    color: #aaa0bb;
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 30px;
}

.login-info {
    padding: 17px;
    border-radius: 16px;
    background: #a855f714;
    border: 1px solid #a855f733;
    color: #d8b4fe;
    font-size: 13px;
    line-height: 1.7;
}

.login-info strong {
    color: white;
}

.redirect {
    margin-top: 28px;
    font-size: 11px;
    color: #81758f;
    letter-spacing: 1px;
}

.loader {
    width: 100%;
    height: 3px;
    margin-top: 15px;
    border-radius: 20px;
    background: #ffffff15;
    overflow: hidden;
}

.loader-bar {
    width: 0;
    height: 100%;
    background: linear-gradient(90deg,#a855f7,#00c8ff);
    box-shadow: 0 0 15px #a855f7;
    animation: progress 3s linear forwards;
}

@keyframes progress {
    to { width: 100%; }
}

.version {
    position: fixed;
    bottom: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #51465f;
    font-size: 9px;
    letter-spacing: 3px;
}

.particle {
    position: fixed;
    width: 4px;
    height: 4px;
    background: #c084fc;
    border-radius: 50%;
    box-shadow: 0 0 15px #a855f7;
    animation: float 5s infinite ease-in-out;
}

.p1 { top: 20%; left: 15%; }
.p2 { top: 70%; left: 10%; animation-delay: 1s; }
.p3 { top: 25%; right: 15%; animation-delay: 2s; }
.p4 { bottom: 20%; right: 18%; animation-delay: .5s; }

@keyframes float {
    0%,100% { transform: translateY(0); opacity: .3; }
    50% { transform: translateY(-30px); opacity: 1; }
}

</style>
</head>

<body>

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>

<div id="app">

    <div class="success">

        <div class="logo">WAY<span>GO</span></div>

        <div class="icon-wrap">
            <div class="check">✓</div>
        </div>

        <h1>Všetko je pripravené!</h1>

        <p class="description">
            Tvoj účet WayGo bol úspešne vytvorený.
            Vitaj v novej generácii cestovania a objavovania.
        </p>

        <div class="login-info">
            ✨ <strong>Pokračujte prihlásením</strong><br>
            Prihláste sa do svojho účtu a objavte WayGo.
        </div>

        <div class="redirect">
            PRESMEROVANIE NA PRIHLÁSENIE
            <div class="loader">
                <div class="loader-bar"></div>
            </div>
        </div>

    </div>

</div>

<div class="version">WAYGO SYSTEMS · 2026</div>

<script>
setTimeout(() => {
    location.replace("login.html");
}, 3000);
</script>

</body>
</html>
