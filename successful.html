
<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080713">
<title>WayGo · Success</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 45%, #7535c744, transparent 45%),
        #080713;
    color: white;
    font-family: Inter, sans-serif;
}

#app {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 22px;
}

.card {
    width: 100%;
    max-width: 430px;
    padding: 45px 28px;
    text-align: center;
    border-radius: 30px;
    background: #171126dd;
    border: 1px solid #ffffff20;
    backdrop-filter: blur(25px);
    box-shadow: 0 0 80px #8b35ff25;
    animation: appear .8s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(30px) scale(.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.logo {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 5px;
    margin-bottom: 40px;
    color: #d8b4fe;
}

.logo span { color: #55caff; }

.icon {
    width: 110px;
    height: 110px;
    margin: auto auto 30px;
    display: grid;
    place-items: center;
    border-radius: 35px;
    background: linear-gradient(135deg,#a855f7,#6538ff,#00c8ff);
    box-shadow: 0 0 35px #a855f777, 0 0 80px #7535ff44;
    font-size: 55px;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% { transform: scale(1.08); }
}

h1 {
    font-size: 29px;
    margin-bottom: 15px;
    background: linear-gradient(90deg,#fff,#d8b4fe,#73d8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.description {
    color: #aaa0bb;
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 28px;
}

.info {
    padding: 17px;
    border-radius: 16px;
    background: #a855f714;
    border: 1px solid #a855f733;
    color: #d8b4fe;
    font-size: 13px;
    line-height: 1.7;
}

.redirect {
    margin-top: 28px;
    color: #81758f;
    font-size: 10px;
    letter-spacing: 2px;
}

.progress {
    width: 100%;
    height: 3px;
    background: #ffffff15;
    margin-top: 15px;
    border-radius: 20px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg,#a855f7,#00c8ff);
    box-shadow: 0 0 15px #a855f7;
    animation: load 3s linear forwards;
}

@keyframes load { to { width: 100%; } }

.version {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 9px;
    color: #51465f;
    letter-spacing: 3px;
}

.particle {
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #c084fc;
    box-shadow: 0 0 15px #a855f7;
    animation: float 5s infinite ease-in-out;
}

.p1 { top: 20%; left: 15%; }
.p2 { top: 70%; left: 10%; }
.p3 { top: 25%; right: 15%; }
.p4 { bottom: 20%; right: 18%; }

@keyframes float {
    50% { transform: translateY(-30px); opacity: 1; }
}
</style>
</head>

<body>

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>

<div id="app">
    <div class="card">

        <div class="logo">WAY<span>GO</span></div>

        <div class="icon" id="icon">✓</div>

        <h1 id="title">Všetko je pripravené!</h1>

        <p class="description" id="description">
            Tvoja akcia prebehla úspešne.
        </p>

        <div class="info" id="info">
            ✨ Vitaj vo WayGo!
        </div>

        <div class="redirect" id="redirectText">
            PRIPRAVUJEME PRESMEROVANIE
            <div class="progress">
                <div class="bar"></div>
            </div>
        </div>

    </div>
</div>

<div class="version">WAYGO SYSTEMS · 2026</div>

<script>
const params = new URLSearchParams(location.search);
const type = params.get("type");

const title = document.getElementById("title");
const description = document.getElementById("description");
const info = document.getElementById("info");
const redirectText = document.getElementById("redirectText");
const icon = document.getElementById("icon");

let destination;

if (type === "signup") {
    icon.textContent = "✓";
    title.textContent = "Účet vytvorený!";
    description.textContent =
        "Tvoja registrácia vo WayGo prebehla úspešne.";
    info.innerHTML =
        "✨ <strong>Pokračuj prihlásením.</strong><br>O chvíľu ťa presmerujeme na prihlasovaciu stránku.";
    redirectText.firstChild.textContent = "PRESMEROVANIE NA PRIHLÁSENIE";
    destination = "login.html";

} else {
    icon.textContent = "✦";
    title.textContent = "Vitaj vo WayGo!";
    description.textContent =
        "Úspešne si sa prihlásil. Tvoje dobrodružstvo sa začína.";
    info.innerHTML =
        "🚀 <strong>Si pripravený vyraziť!</strong><br>Práve otvárame tvoj WayGo svet.";
    redirectText.firstChild.textContent = "VSTUP DO WAYGO";
    destination = "home.html";
}

setTimeout(() => {
    location.replace(destination);
}, 3000);
</script>

</body>
</html>
