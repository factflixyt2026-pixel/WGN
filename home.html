
<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WayGo | Home</title>

<style>
:root {
    --bg: #09080e;
    --surface: #12101b;
    --surface2: #1b1728;
    --purple: #9147ff;
    --purple2: #7029df;
    --text: #ffffff;
    --muted: #9690a5;
    --border: #292238;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 100px;
}

/* HEADER */

header {
    background: rgba(18,16,27,.95);
    border-bottom: 1px solid var(--border);
    padding: 17px 6%;
    display: flex;
    align-items: center;
    gap: 30px;
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(15px);
}

.logo {
    font-size: 29px;
    font-weight: 900;
    letter-spacing: -1.5px;
    color: var(--purple);
    text-shadow: 0 0 20px #9147ff55;
}

.logo span {
    color: white;
}

.search {
    flex: 1;
    max-width: 650px;
}

.search input {
    width: 100%;
    padding: 14px 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 13px;
    color: white;
    outline: none;
    font-size: 14px;
    transition: .2s;
}

.search input:focus {
    border-color: var(--purple);
    box-shadow: 0 0 15px #9147ff25;
}

.search input::placeholder {
    color: #827b92;
}

/* MAIN */

main {
    max-width: 900px;
    margin: 35px auto;
    padding: 0 20px;
}

.welcome {
    margin-bottom: 30px;
}

.welcome h1 {
    font-size: 30px;
    margin-bottom: 9px;
}

.welcome h1 span {
    color: var(--purple);
}

.welcome p {
    color: var(--muted);
    font-size: 14px;
}

/* CATEGORY */

.category-heading {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 13px;
}

.categories {
    display: flex;
    flex-wrap: wrap;
    gap: 11px;
    margin-bottom: 35px;
}

.category {
    padding: 12px 23px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: #aaa2ba;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: .25s;
}

.category:hover {
    border-color: var(--purple);
    color: white;
    transform: translateY(-2px);
}

.category.active {
    background: linear-gradient(135deg, #9147ff, #6225cb);
    color: white;
    border-color: transparent;
    box-shadow: 0 4px 20px #9147ff45;
}

/* FEED */

.feed-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.feed-header h2 {
    font-size: 21px;
}

.feed-header span {
    color: var(--purple);
    font-size: 13px;
}

.feed {
    display: flex;
    flex-direction: column;
    gap: 17px;
}

.post {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 23px;
    border-radius: 17px;
    transition: .25s;
}

.post:hover {
    border-color: #7540c2;
    transform: translateY(-2px);
    box-shadow: 0 8px 25px #00000040;
}

.post h3 {
    margin-bottom: 12px;
    font-size: 19px;
}

.post p {
    color: #b4aec0;
    line-height: 1.7;
    font-size: 14px;
}

.post-category {
    display: inline-block;
    margin-bottom: 13px;
    padding: 6px 11px;
    background: #281a40;
    color: #b58aff;
    border: 1px solid #49306d;
    border-radius: 7px;
    font-size: 11px;
    font-weight: bold;
}

.empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 15px;
}

/* BOTTOM NAVBAR */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(18,16,27,.96);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    gap: 65px;
    padding: 13px 10px;
    z-index: 20;
    backdrop-filter: blur(15px);
}

.nav-item {
    text-decoration: none;
    color: #777083;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: bold;
    min-width: 65px;
    transition: .2s;
}

.nav-item .icon {
    font-size: 23px;
}

.nav-item:hover,
.nav-item.active {
    color: var(--purple);
}

.nav-item.active .icon {
    filter: drop-shadow(0 0 7px #9147ff);
}

/* MOBILE */

@media(max-width: 600px) {
    header {
        padding: 14px 16px;
        gap: 13px;
    }

    .logo {
        font-size: 23px;
    }

    .search input {
        padding: 12px;
        font-size: 12px;
    }

    main {
        margin-top: 27px;
    }

    .welcome h1 {
        font-size: 25px;
    }

    .categories {
        gap: 8px;
    }

    .category {
        flex: 1;
        padding: 12px 10px;
        font-size: 12px;
    }

    .bottom-nav {
        justify-content: space-around;
        gap: 0;
    }

    .post {
        padding: 18px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Way<span>Go.</span></div>

    <div class="search">
        <input
            type="search"
            id="searchInput"
            placeholder="⌕ Hľadaj príspevky..."
        >
    </div>
</header>

<main>

    <section class="welcome">
        <h1>Vitaj späť vo <span>WayGo.</span> 👋</h1>
        <p>Uč sa. Napreduj. Dosiahni svoj cieľ.</p>
    </section>

    <p class="category-heading">Vyber si kategóriu</p>

    <section class="categories">
        <button class="category" data-category="BIO">BIO</button>
        <button class="category" data-category="LF">LF</button>
        <button class="category" data-category="CHEM">CHEM</button>
        <button class="category" data-category="SCIO">SCIO</button>
    </section>

    <section class="feed-header">
        <h2>Pre teba ✨</h2>
        <span>WAYGO FEED</span>
    </section>

    <section class="feed" id="feed">
        <div class="empty">Načítavam príspevky...</div>
    </section>

</main>

<nav class="bottom-nav">

    <a href="social.html" class="nav-item">
        <span class="icon">♧</span>
        <span>Sieť</span>
    </a>

    <a href="home.html" class="nav-item active">
        <span class="icon">⌂</span>
        <span>Domov</span>
    </a>

    <a href="account.html" class="nav-item">
        <span class="icon">♙</span>
        <span>Účet</span>
    </a>

</nav>

<script>

const selectedCategories = new Set();

const feedContainer = document.getElementById("feed");
const searchInput = document.getElementById("searchInput");

const feedFiles = [
    "feed1.html",
    "feed2.html",
    "feed3.html"
];

let allPosts = [];

async function loadFeeds() {

    allPosts = [];

    for (const file of feedFiles) {

        try {

            const response = await fetch(file);

            if (!response.ok) continue;

            const html = await response.text();

            const doc = new DOMParser()
                .parseFromString(html, "text/html");

            doc.querySelectorAll(".post").forEach(post => {
                allPosts.push(post.cloneNode(true));
            });

        } catch (error) {

            console.error("Chyba pri načítaní " + file, error);

        }
    }

    renderFeed();
}

function renderFeed() {

    feedContainer.innerHTML = "";

    const search = searchInput.value.toLowerCase();

    const filteredPosts = allPosts.filter(post => {

        const category = (
            post.dataset.category ||
            post.querySelector(".post-category")?.textContent ||
            ""
        ).trim().toUpperCase();

        const matchesCategory =
            selectedCategories.size === 0 ||
            selectedCategories.has(category);

        const matchesSearch =
            post.textContent.toLowerCase().includes(search);

        return matchesCategory && matchesSearch;
    });

    if (filteredPosts.length === 0) {

        feedContainer.innerHTML =
            '<div class="empty">Žiadne príspevky sa nenašli. 💜</div>';

        return;
    }

    filteredPosts.forEach(post => {
        feedContainer.appendChild(post.cloneNode(true));
    });
}

document.querySelectorAll(".category").forEach(button => {

    button.addEventListener("click", () => {

        const category = button.dataset.category;

        if (selectedCategories.has(category)) {

            selectedCategories.delete(category);
            button.classList.remove("active");

        } else {

            selectedCategories.add(category);
            button.classList.add("active");

        }

        renderFeed();

    });

});

searchInput.addEventListener("input", renderFeed);

loadFeeds();

</script>

</body>
</html>
