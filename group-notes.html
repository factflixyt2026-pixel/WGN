<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skupinové poznámky | WayGo</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#45206555,transparent 50%),#090711;color:#f9f3ff;font:15px/1.6 'DM Sans',system-ui}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.shell{max-width:1100px;margin:auto;padding:24px 18px 90px}.nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff22;padding-bottom:20px;gap:15px}.brand{font-size:25px;font-weight:800}.brand span{color:#d38bff}.nav a{margin-right:15px}.hero{padding:40px 0 22px}.hero h1{font-size:clamp(35px,6vw,62px);letter-spacing:-2px;line-height:1.1;margin:10px 0}.muted{color:#b9a8cb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:linear-gradient(145deg,#241631,#130d20);border:1px solid #503565;border-radius:22px;padding:24px}.card h2{margin:0 0 10px}.eyebrow{color:#c89cff;font-size:12px;font-weight:800;letter-spacing:1.5px}.btn{display:inline-block;border:0;background:linear-gradient(110deg,#a76dff,#e98cf0);border-radius:12px;padding:11px 15px;color:#1b1023;font-weight:800;cursor:pointer}.btn.alt{background:#352449;color:white;border:1px solid #684d80}.buttons{display:flex;gap:10px;flex-wrap:wrap}.field{background:#100a1c;border:1px solid #684b80;color:white;border-radius:12px;padding:12px;width:100%;margin:7px 0 14px}.stat{font-size:36px;font-weight:800;color:#d8a6ff}.bar{height:10px;border-radius:10px;background:#39254e;overflow:hidden}.bar>div{height:100%;background:#c38aff}.small{font-size:12px;color:#c7b6d8}.notice{background:#32213e;border:1px solid #765b8b;padding:14px;border-radius:13px;margin:14px 0}@media(max-width:600px){.nav a:not(.brand){font-size:12px;margin-right:5px}.card{padding:18px}}</style><script defer src="icons.js"></script><link rel="stylesheet" href="polish.css"><link rel="stylesheet" href="experience.css"></head><body><div class="shell"><nav class="nav"><a class="brand" href="home.html">way<span>go.</span></a><div><a href="feed.html">Feed</a><a href="notes.html">Zošity</a><a href="account.html">Profil</a></div></nav><header class="hero"><div class="eyebrow">SPOLU SA UČÍ LEPŠIE</div><h1>Skupinové poznámky.</h1><p class="muted">Zdieľaj materiály len s členmi svojej študijnej skupiny.</p></header><div class="grid"><section class="card"><h2>Nová poznámka</h2><label>Skupina<select class="field" id="group"></select></label><label>Názov<input class="field" id="title" maxlength="120"></label><label>Obsah<textarea class="field" id="content" rows="7"></textarea></label><button class="btn" id="publish">Zdieľať v skupine</button><p id="msg" class="small"></p></section><section class="card"><h2>Materiály skupiny</h2><div id="list" class="muted">Vyber skupinu.</div><h2>Spoločné kvízy</h2><select class="field" id="quizTopic"></select><button class="btn alt" id="challenge">Pridať kvíz skupine</button><div id="challenges"></div></section></div></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const c=window.WAYGO_CONFIG||{},db=c.supabaseUrl&&c.supabaseAnonKey&&window.supabase?window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey):null;let uid=null;const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[x]));async function init(){if(!db){document.getElementById('msg').textContent='Nastav Supabase.';return}const {data:{user}}=await db.auth.getUser();if(!user){document.getElementById('msg').textContent='Najprv sa prihlás.';return}uid=user.id;const r=await db.from('group_members').select('group_id,study_groups(name)').eq('user_id',uid);if(r.error){document.getElementById('msg').textContent=r.error.message;return}document.getElementById('group').innerHTML=(r.data||[]).map(x=>'<option value="'+x.group_id+'">'+esc(x.study_groups?.name||'Skupina')+'</option>').join('');load();loadQuizzes()}async function load(){const id=document.getElementById('group').value;if(!id)return;const r=await db.from('group_notes').select('title,content,created_at').eq('group_id',id).order('created_at',{ascending:false}).limit(60);document.getElementById('list').innerHTML=r.error?esc(r.error.message):(r.data||[]).map(x=>'<div style="border-bottom:1px solid #ffffff24;padding:12px 0"><strong>'+esc(x.title)+'</strong><p style="white-space:pre-wrap">'+esc(x.content)+'</p></div>').join('')||'Zatiaľ žiadne poznámky.'}document.getElementById('group').onchange=()=>{load();loadQuizzes()};document.getElementById('publish').onclick=async()=>{const title=document.getElementById('title').value.trim(),content=document.getElementById('content').value,group_id=document.getElementById('group').value;if(!uid||!group_id||!title)return;const r=await db.from('group_notes').insert({author_id:uid,group_id,title,content});document.getElementById('msg').textContent=r.error?r.error.message:'Poznámka zdieľaná.';if(!r.error)load()};const topics=['Biológia a živé sústavy','Chemické zloženie bunky','Sacharidy a bunkové povrchy','Bunková stena a membrány','Bunkové organely','Mitochondrie a plastidy','Lyzozómy a bunkové procesy','DNA a bunkové štruktúry','Tkanivá a pletivá','Transport cez membránu','ATP a metabolizmus','Energetické procesy','Chromozómy a delenie','Bunkový cyklus','Rozmnožovanie','Pohlavné bunky','Zárodočné listy a vývin','Gametogenéza','Expresia génov','Nukleotidy a genetický kód','Operón a regulácia génov'];document.getElementById('quizTopic').innerHTML=topics.map((t,i)=>'<option value="'+i+'">'+esc(t)+'</option>').join('');
async function loadQuizzes(){if(!db)return;const id=document.getElementById('group').value;if(!id)return;const r=await db.from('group_quizzes').select('topic_index,created_at').eq('group_id',id).order('created_at',{ascending:false}).limit(20);document.getElementById('challenges').innerHTML=r.error?esc(r.error.message):(r.data||[]).map(x=>'<p><a href="feed.html#q'+(x.topic_index*10+1)+'">'+esc(topics[x.topic_index])+' →</a></p>').join('')||'<p class="muted">Zatiaľ žiadne kvízy.</p>'}
document.getElementById('challenge').onclick=async()=>{if(!db||!uid)return;const r=await db.from('group_quizzes').insert({group_id:document.getElementById('group').value,creator_id:uid,topic_index:Number(document.getElementById('quizTopic').value)});document.getElementById('msg').textContent=r.error?r.error.message:'Kvíz pridaný do skupiny.';if(!r.error)loadQuizzes()};
init();</script><script src="polish.js" defer></script><script defer src="experience.js"></script></body></html>
