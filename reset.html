<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10091c"><title>Nové heslo · WayGo</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#090711;--panel:#151020;--panel2:#1d1530;--purple:#9b5cff;--pink:#c084fc;--text:#f7f2ff;--muted:#aaa0bb;--line:#302440;--good:#7ce5b2;--danger:#ff7894}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#24133c 0,#090711 55%);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1050px;margin:auto;padding:24px 20px 110px}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand span{color:var(--purple)}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:5px 0 28px}.card{background:linear-gradient(145deg,#1c142a,#110d1b);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 14px 35px #0003}.muted{color:var(--muted)}.small{font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.btn{background:var(--purple);color:white;border-radius:12px;padding:11px 16px;font-weight:700}.btn.secondary{background:#2a203a;border:1px solid #48345f}.btn.danger{background:#572337}.btn:disabled{opacity:.45;cursor:not-allowed}.field{width:100%;padding:12px 14px;border-radius:11px;background:#0d0a15;border:1px solid var(--line);color:white;margin:7px 0 14px}.label{font-size:13px;color:var(--muted)}h1{font-size:32px;margin:0 0 8px}h2{font-size:21px;margin:0 0 14px}h3{font-size:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.pill{border:1px solid var(--line);background:#1a1426;color:var(--muted);border-radius:99px;padding:9px 14px}.pill.active{background:#4b2a70;color:white;border-color:var(--purple)}.post{min-height:210px;display:flex;flex-direction:column;justify-content:space-between}.post p{white-space:pre-wrap;line-height:1.6}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#100b1beF;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:clamp(20px,9vw,100px);padding:12px}.navitem{color:var(--muted);font-size:12px;text-align:center;min-width:55px}.navitem b{display:block;font-size:21px;margin-bottom:2px}.navitem.active{color:#c69bff}.notice{padding:12px 14px;border-radius:12px;background:#251a35;color:#d9c6f5;margin:12px 0}.hidden{display:none!important}.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#34234a;border:2px solid var(--purple)}.stat{font-size:28px;font-weight:800;color:#d2adff}.auth{max-width:440px;margin:7vh auto;padding:25px}.center{text-align:center}.error{color:var(--danger)}.success{color:var(--good)}@media(max-width:600px){.wrap{padding:18px 14px 100px}h1{font-size:27px}.card{padding:16px}}

:root{--bg:#080611;--panel:#141025;--panel2:#211637;--purple:#a855f7;--pink:#f472d0;--text:#fbf8ff;--muted:#aaa0c2;--line:#382653;--good:#72f5c0;--danger:#ff719c}
body{background:radial-gradient(ellipse at 12% 0%,#3b1762 0,transparent 35%),radial-gradient(ellipse at 90% 18%,#182b63 0,transparent 32%),linear-gradient(150deg,#080611,#0d0918 55%,#10091c);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:radial-gradient(#fff .65px,transparent .65px);background-size:23px 23px}
.brand{letter-spacing:-1.4px;text-shadow:0 0 28px #a855f766}.brand span{background:linear-gradient(90deg,#c084fc,#67e8f9,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.top{padding:12px 16px;border:1px solid #ffffff12;border-radius:20px;background:#100b1bbd;backdrop-filter:blur(20px)}
.card{background:linear-gradient(145deg,#201632ef,#100d1cf2);border:1px solid #ffffff16;border-radius:24px;box-shadow:0 18px 55px #0004,inset 0 1px #ffffff0a;transition:transform .22s,border-color .22s}.card:hover{transform:translateY(-3px);border-color:#b77cff77}
h1{font-size:clamp(28px,4vw,42px);letter-spacing:-1.5px;background:linear-gradient(100deg,#fff,#d9b8ff 58%,#8be9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(110deg,#9333ea,#c026d3 58%,#6366f1);box-shadow:0 8px 25px #9333ea44,inset 0 1px #ffffff55;transition:transform .18s}.btn:hover{transform:translateY(-2px) scale(1.015)}
.btn.secondary,.pill{background:#ffffff0b;border:1px solid #ffffff20;color:#eee5ff}.pill.active{background:linear-gradient(110deg,#7834ba,#4d3aa0);border-color:#c084fc;color:white}
.field{background:#0b0814;border:1px solid #ffffff20}.field:focus{outline:none;border-color:#b77cff;box-shadow:0 0 0 3px #a855f722}
.bottom{background:#0c0816ef;border-top:1px solid #ffffff18;box-shadow:0 -10px 40px #0005}.navitem b{font-size:23px;text-shadow:0 0 20px #c084fc66}
.stat{background:linear-gradient(100deg,#e9d5ff,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.notice{background:linear-gradient(110deg,#54237a66,#273b7b55);border:1px solid #ffffff18}
.auth{border-radius:28px;box-shadow:0 30px 100px #0008,0 0 55px #9333ea22}
@keyframes floatGlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.splash .logo{animation:floatGlow 2.8s ease-in-out infinite;text-shadow:0 0 20px #a855f7,0 0 65px #9333ea}
.splash .word{background:linear-gradient(90deg,#fff,#d8b4fe,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
::selection{background:#a855f766}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="auth card"><h1>Obnovenie hesla</h1><p class="muted">Zadaj nové heslo k svojmu účtu.</p><input id="pw" class="field" type="password" placeholder="Nové heslo"><button id="save" class="btn">Uložiť heslo</button><p id="msg" class="notice hidden"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.WAYGO_CONFIG={SUPABASE_URL:"https://YOUR_PROJECT.supabase.co",SUPABASE_ANON_KEY:"YOUR_SUPABASE_ANON_KEY"};</script><script>const c=supabase.createClient(WAYGO_CONFIG.SUPABASE_URL,WAYGO_CONFIG.SUPABASE_ANON_KEY);save.onclick=async()=>{let {error}=await c.auth.updateUser({password:pw.value});msg.textContent=error?.message||'Heslo bolo zmenené.';msg.classList.remove('hidden')};</script></body></html>
