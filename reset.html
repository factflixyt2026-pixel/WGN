<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nové heslo · WayGo</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth card"><h1>Obnovenie hesla</h1><p class="muted">Zadaj nové heslo k svojmu účtu.</p><input id="pw" class="field" type="password" placeholder="Nové heslo"><button id="save" class="btn">Uložiť heslo</button><p id="msg" class="notice hidden"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=supabase.createClient(WAYGO_CONFIG.SUPABASE_URL,WAYGO_CONFIG.SUPABASE_ANON_KEY);save.onclick=async()=>{let {error}=await c.auth.updateUser({password:pw.value});msg.textContent=error?.message||'Heslo bolo zmenené.';msg.classList.remove('hidden')};</script></body></html>
