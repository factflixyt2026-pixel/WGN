<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>waygo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          rgba(126, 34, 206, 0.22),
          transparent 38%
        ),
        #030205;

      font-family: Arial, Helvetica, sans-serif;
    }

    /* Fialové svetlo */

    .glow {
      position: fixed;

      width: 400px;
      height: 400px;

      border-radius: 50%;

      background: #7c3aed;

      filter: blur(150px);

      opacity: 0.13;

      animation: glowPulse 3s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from {
        transform: scale(0.85);
        opacity: 0.08;
      }

      to {
        transform: scale(1.15);
        opacity: 0.18;
      }
    }

    /* Logo */

    .logo {
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    /* W */

    .w-svg {
      width: 250px;
      height: 250px;

      overflow: visible;
    }

    .w-line {
      fill: none;

      stroke: #b66cff;

      stroke-width: 18;

      stroke-linecap: round;
      stroke-linejoin: round;

      filter:
        drop-shadow(0 0 5px #b66cff)
        drop-shadow(0 0 15px #9333ea)
        drop-shadow(0 0 30px rgba(147, 51, 234, 0.65));
    }

    /*
      W sa kreslí po jednotlivých ťahoch
    */

    .stroke1 {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;

      animation:
        draw1 0.65s ease forwards;
    }

    .stroke2 {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;

      animation:
        draw2 0.55s ease forwards;

      animation-delay: 0.55s;
    }

    .stroke3 {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;

      animation:
        draw3 0.55s ease forwards;

      animation-delay: 1s;
    }

    .stroke4 {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;

      animation:
        draw4 0.65s ease forwards;

      animation-delay: 1.45s;
    }

    @keyframes draw1 {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes draw2 {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes draw3 {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes draw4 {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Jemné dokončenie */

    .w-svg {
      animation: wFinish 0.5s ease forwards;
      animation-delay: 2s;
    }

    @keyframes wFinish {
      0% {
        transform: scale(1);
      }

      60% {
        transform: scale(1.04);
      }

      100% {
        transform: scale(1);
      }
    }

    /* waygo */

    .name {
      margin-top: 5px;

      font-size: 52px;

      font-weight: 900;

      letter-spacing: -2px;

      color: white;

      opacity: 0;

      transform: translateY(15px);

      animation:
        nameAppear 0.7s ease forwards;

      animation-delay: 1.9s;

      text-shadow:
        0 0 15px rgba(168, 85, 247, 0.35);
    }

    .name span {
      color: #a855f7;

      text-shadow:
        0 0 15px rgba(168, 85, 247, 0.65);
    }

    @keyframes nameAppear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Načítavanie */

    .loading {
      margin-top: 38px;

      color: #706878;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 5px;

      opacity: 0;

      animation:
        fadeIn 0.5s ease forwards;

      animation-delay: 2s;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Progress */

    .progress {
      width: 210px;
      height: 3px;

      margin-top: 14px;

      overflow: hidden;

      border-radius: 20px;

      background: rgba(255, 255, 255, 0.07);

      opacity: 0;

      animation:
        fadeIn 0.5s ease forwards;

      animation-delay: 2s;
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      border-radius: 20px;

      background: linear-gradient(
        90deg,
        #6d28d9,
        #9333ea,
        #c084fc
      );

      box-shadow:
        0 0 10px #9333ea,
        0 0 20px #7c3aed;

      animation:
        progress 3s linear forwards;
    }

    @keyframes progress {
      from {
        width: 0%;
      }

      to {
        width: 100%;
      }
    }

    /* Mobil */

    @media (max-width: 600px) {

      .w-svg {
        width: 210px;
        height: 210px;
      }

      .name {
        font-size: 43px;
      }

      .progress {
        width: 180px;
      }
    }
  </style>
</head>

<body>

  <!-- Fialový glow -->

  <div class="glow"></div>


  <!-- LOGO -->

  <div class="logo">

    <!-- Veľké tlačené W -->

    <svg
      class="w-svg"
      viewBox="0 0 250 250"
      xmlns="http://www.w3.org/2000/svg"
    >

      <!-- 1. ľavý ťah -->

      <line
        class="w-line stroke1"
        x1="25"
        y1="35"
        x2="75"
        y2="215"
      />


      <!-- 2. prvý vnútorný ťah -->

      <line
        class="w-line stroke2"
        x1="75"
        y1="215"
        x2="125"
        y2="35"
      />


      <!-- 3. druhý vnútorný ťah -->

      <line
        class="w-line stroke3"
        x1="125"
        y1="35"
        x2="175"
        y2="215"
      />


      <!-- 4. pravý ťah -->

      <line
        class="w-line stroke4"
        x1="175"
        y1="215"
        x2="225"
        y2="35"
      />

    </svg>


    <!-- waygo -->

    <div class="name">
      <span>W</span>ago
    </div>


    <!-- Načítavanie -->




    <div class="progress">
      <div class="progress-bar"></div>
    </div>

  </div>


  <script>

    /*
      Po 3 sekundách prejde na login.html.
    */

    setTimeout(() => {
      window.location.href = "login.html";
    }, 3000);

  </script>

</body>
</html>
