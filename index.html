<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WayGO</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(
                    circle at 50% 50%,
                    #35106b 0%,
                    #19052f 38%,
                    #080013 72%,
                    #020005 100%
                );

            font-family: Arial, Helvetica, sans-serif;
        }

        /* =====================================
           VESMÍR
        ===================================== */

        .space {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Fialová hmlovina */

        .nebula {
            position: absolute;

            width: 750px;
            height: 750px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(168, 85, 247, 0.22),
                    rgba(126, 34, 206, 0.10) 35%,
                    transparent 70%
                );

            filter: blur(45px);
        }

        /* =====================================
           HVIEZDY
        ===================================== */

        #stars {
            position: absolute;
            inset: 0;
        }

        .star {
            position: absolute;

            background: white;

            border-radius: 50%;

            box-shadow:
                0 0 5px white,
                0 0 10px rgba(216, 180, 254, 0.8);

            opacity: var(--opacity);

            animation:
                twinkle
                var(--duration)
                ease-in-out
                infinite alternate;
        }

        @keyframes twinkle {

            from {
                transform: scale(0.6);
            }

            to {
                transform: scale(1.4);
            }
        }

        /* =====================================
           GULIČKA
        ===================================== */

        .meteor {

            position: absolute;

            /*
                ZAČIATOK:
                pravý horný roh
            */

            left: 108vw;
            top: -8vh;

            width: 14px;
            height: 14px;

            border-radius: 50%;

            background: white;

            opacity: 0;

            z-index: 20;

            box-shadow:
                0 0 10px white,
                0 0 25px white,
                0 0 45px #f3e8ff,
                0 0 70px #c084fc,
                0 0 110px #9333ea;

            animation:
                meteorMove
                3s
                cubic-bezier(0.18, 0.75, 0.25, 1)
                forwards;

            animation-delay: 1.5s;
        }

        /*
            GULIČKA LETÍ
            ↙️
            z pravého horného rohu
            do stredu
        */

        @keyframes meteorMove {

            0% {

                left: 108vw;
                top: -8vh;

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0.15);
            }

            8% {
                opacity: 1;
            }

            30% {

                left: 88vw;
                top: 14vh;

                transform:
                    translate(-50%, -50%)
                    scale(0.4);
            }

            50% {

                left: 73vw;
                top: 30vh;

                transform:
                    translate(-50%, -50%)
                    scale(0.9);
            }

            70% {

                left: 61vw;
                top: 43vh;

                transform:
                    translate(-50%, -50%)
                    scale(2);
            }

            88% {

                left: 53vw;
                top: 51vh;

                transform:
                    translate(-50%, -50%)
                    scale(5);
            }

            /*
                DOPAD
            */

            100% {

                left: 50vw;
                top: 53vh;

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(16);
            }
        }

        /* =====================================
           ZÁBLESK
        ===================================== */

        .impact {

            position: absolute;

            left: 50%;
            top: 53%;

            width: 15px;
            height: 15px;

            border-radius: 50%;

            background: white;

            opacity: 0;

            z-index: 15;

            transform:
                translate(-50%, -50%)
                scale(0);

            box-shadow:
                0 0 20px white,
                0 0 50px #f3e8ff,
                0 0 100px #c084fc,
                0 0 180px #9333ea;

            animation:
                impact
                1s
                ease-out
                forwards;

            animation-delay: 4.35s;
        }

        @keyframes impact {

            0% {

                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(0);
            }

            35% {

                opacity: 0.9;

                transform:
                    translate(-50%, -50%)
                    scale(7);
            }

            100% {

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(35);
            }
        }

        /* =====================================
           ISKRY
        ===================================== */

        .spark {

            position: absolute;

            left: 50%;
            top: 53%;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 8px white,
                0 0 18px #c084fc;

            opacity: 0;

            z-index: 16;

            --x: 0px;
            --y: 0px;

            animation:
                sparkFly
                1.2s
                ease-out
                forwards;

            animation-delay: 4.35s;
        }

        @keyframes sparkFly {

            0% {

                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            100% {

                opacity: 0;

                transform:
                    translate(
                        calc(-50% + var(--x)),
                        calc(-50% + var(--y))
                    )
                    scale(0.1);
            }
        }

        /* =====================================
           WAYGO
        ===================================== */

        .logo {

            position: absolute;

            left: 50%;
            top: 53%;

            color: white;

            font-size:
                clamp(55px, 13vw, 140px);

            font-weight: 900;

            letter-spacing: 10px;

            opacity: 0;

            z-index: 30;

            transform:
                translate(-50%, -50%)
                scale(0.1);

            text-shadow:
                0 0 10px white,
                0 0 20px #f3e8ff,
                0 0 40px #d8b4fe,
                0 0 70px #a855f7,
                0 0 110px #7e22ce,
                0 0 160px #581c87;

            animation:
                logoAppear
                1.3s
                cubic-bezier(0.17, 0.67, 0.32, 1.4)
                forwards;

            animation-delay: 4.65s;
        }

        @keyframes logoAppear {

            0% {

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0.1);

                filter: blur(20px);
            }

            40% {

                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1.2);

                filter: blur(0);
            }

            65% {

                transform:
                    translate(-50%, -50%)
                    scale(0.96);
            }

            100% {

                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1);

                filter: blur(0);
            }
        }

        /* =====================================
           MOBIL
        ===================================== */

        @media (max-width: 600px) {

            .logo {
                letter-spacing: 5px;
            }

        }

    </style>
</head>


<body>

    <div class="space">

        <!-- Fialová hmlovina -->
        <div class="nebula"></div>

        <!-- Náhodné hviezdy -->
        <div id="stars"></div>

        <!-- IBA GULIČKA -->
        <div class="meteor"></div>

        <!-- Záblesk -->
        <div class="impact"></div>

        <!-- WayGO -->
        <div class="logo">
            WayGO
        </div>

    </div>


    <script>

        /* =====================================
           VYTVORENIE HVIEZD
        ===================================== */

        const starsContainer =
            document.getElementById("stars");

        const numberOfStars = 220;

        for (let i = 0; i < numberOfStars; i++) {

            const star =
                document.createElement("div");

            star.classList.add("star");

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            const size =
                Math.random() * 2.5 + 1;

            star.style.width =
                size + "px";

            star.style.height =
                size + "px";

            star.style.setProperty(
                "--opacity",
                Math.random() * 0.7 + 0.3
            );

            star.style.setProperty(
                "--duration",
                Math.random() * 3 + 1.5 + "s"
            );

            star.style.animationDelay =
                Math.random() * 4 + "s";

            starsContainer.appendChild(star);
        }


        /* =====================================
           ISKRY PO DOPADE
        ===================================== */

        const space =
            document.querySelector(".space");

        for (let i = 0; i < 40; i++) {

            const spark =
                document.createElement("div");

            spark.classList.add("spark");

            const angle =
                Math.random() * Math.PI * 2;

            const distance =
                Math.random() * 180 + 60;

            const x =
                Math.cos(angle) * distance;

            const y =
                Math.sin(angle) * distance;

            spark.style.setProperty(
                "--x",
                x + "px"
            );

            spark.style.setProperty(
                "--y",
                y + "px"
            );

            spark.style.animationDelay =
                4.35 +
                Math.random() * 0.2 +
                "s";

            space.appendChild(spark);
        }


        /* =====================================
           PRESMEROVANIE
        ===================================== */

        /*
            1.5 s → gulička vyletí
            4.5 s → dopad
            4.65 s → WayGO
            7.65 s → main.html
        */

        setTimeout(() => {

            window.location.href =
                "main.html";

        }, 7650);

    </script>

</body>
</html>
