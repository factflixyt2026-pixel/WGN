
<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WG</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: #050408;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .background {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 110%, #581c87 0%, transparent 50%),
                #050408;
        }

        .line {
            position: absolute;
            width: 1px;
            height: 100%;
            background: linear-gradient(
                transparent,
                #9333ea55,
                transparent
            );
            left: 50%;
            opacity: 0.4;
        }

        .content {
            position: relative;
            text-align: center;
            z-index: 2;
            animation: reveal 1.8s ease forwards;
        }

        .logo {
            font-size: clamp(110px, 22vw, 190px);
            font-weight: 900;
            letter-spacing: -15px;
            line-height: 1;
            background: linear-gradient(
                135deg,
                #ffffff 10%,
                #d8b4fe 45%,
                #9333ea 85%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 35px #9333ea55);
        }

        .divider {
            width: 55px;
            height: 2px;
            margin: 30px auto 20px;
            background: #a855f7;
            box-shadow: 0 0 15px #a855f7;
        }

        .caption {
            color: #aaa0b8;
            font-size: 10px;
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        .corner {
            position: absolute;
            color: #62556f;
            font-size: 10px;
            letter-spacing: 3px;
        }

        .top {
            top: 35px;
            left: 40px;
        }

        .bottom {
            bottom: 35px;
            right: 40px;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(25px);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @media(max-width: 500px) {
            .logo {
                letter-spacing: -9px;
            }

            .caption {
                letter-spacing: 5px;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div class="line"></div>

    <div class="corner top">EST. 2026</div>

    <main class="content">
        <div class="logo">WG</div>

        <div class="divider"></div>

        <div class="caption">
            Welcome to WayGo
        </div>
    </main>

    <div class="corner bottom">EXPERIENCE MORE.</div>

    <script>
        setTimeout(() => {
            window.location.replace("login.html");
        }, 3000);
    </script>

</body>
</html>
