
<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WayGo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: #080713;
    color: white;
    font-family: 'Inter', sans-serif;
}

.splash {
    height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 45%, #51218c55 0%, transparent 45%),
        radial-gradient(circle at 15% 20%, #1d7aff20, transparent 35%),
        radial-gradient(circle at 85% 80%, #ff39c420, transparent 35%),
        #080713;
}

/* Neon background */
.splash::before {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: #9c3cff;
    filter: blur(150px);
    opacity: .25;
    animation: glow 4s infinite alternate;
}

@keyframes glow {
    from { transform: scale(.8); opacity: .15; }
    to { transform: scale(1.3); opacity: .35; }
}

/* Floating particles */
.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #cba0ff;
    box-shadow: 0 0 15px #bc69ff;
    animation: float 5s infinite ease-in-out;
}

.p1 { top: 20%; left: 20%; }
.p2 { top: 70%; left: 15%; animation-delay: 1s; }
.p3 { top: 25%; right: 18%; animation-delay: 2s; }
.p4 { bottom: 15%; right: 25%; animation-delay: 3s; }
.p5 { top: 50%; right: 10%; animation-delay: .5s; }

@keyframes float {
    0%,100% { transform: translateY(0); opacity: .3; }
    50% { transform: translateY(-35px); opacity: 1; }
}

/* Logo */
.logo-container {
    position: relative;
    z-index: 2;
    animation: appear 1.2s ease forwards;
}

.logo {
    width: 125px;
    height: 125px;
    display: grid;
    place-items: center;
    border-radius: 35px;
    font-family: 'Orbitron', sans-serif;
    font-size: 48px;
    font-weight: 900;
    letter-spacing: -5px;
    color: white;

    background: linear-gradient(135deg, #a855f7, #6738ff 50%, #00c8ff);
    box-shadow:
        0 0 25px #a855f755,
        0 0 70px #783bff55,
        inset 0 0 20px #ffffff30;

    border: 1px solid #ffffff55;
    animation: pulse 3s infinite ease-in-out;
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
        box-shadow: 0 0 25px #a855f755, 0 0 60px #783bff55;
    }
    50% {
        transform: scale(1.07);
        box-shadow: 0 0 40px #c084fcaa, 0 0 100px #783bffaa;
    }
}

.word {
    margin-top: 30px;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 5px;
    background: linear-gradient(90deg, #ffffff, #d8b4fe, #65d8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: appear 1.5s ease forwards;
}

.tagline {
    margin-top: 12px;
    font-size: 10px;
    letter-spacing: 5px;
    color: #a99bbf;
    text-transform: uppercase;
    animation: appear 2s ease forwards;
}

/* Loading */
.loading {
    position: absolute;
    bottom: 12%;
    width: 150px;
    text-align: center;
    z-index: 2;
}

.loading-text {
    font-size: 10px;
    letter-spacing: 3px;
    color: #a99bbf;
    margin-bottom: 13px;
}

.progress {
    height: 3px;
    width: 100%;
    background: #ffffff15;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #a855f7, #00d4ff);
    box-shadow: 0 0 15px #a855f7;
    border-radius: 20px;
    animation: loading 2.8s linear forwards;
}

@keyframes loading {
    to { width: 100%; }
}

@keyframes appear {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

.version {
    position: absolute;
    bottom: 25px;
    color: #625775;
    font-size: 9px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="splash">

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>

    <div class="logo-container">
        <div class="logo">WG</div>
    </div>

    <div class="word">WayGo</div>
    <div class="tagline">Your world. Your way.</div>

    <div class="loading">
        <div class="loading-text">INITIALIZING EXPERIENCE</div>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
    </div>

    <div class="version">WAYGO SYSTEMS · 2026</div>

</div>

<script>
setTimeout(() => {
    location.replace('login.html');
}, 3000);
</script>

</body>
</html>
