<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAYGO — Už čoskoro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 45%, #29104d 0%, #10091d 38%, #050308 75%);
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    /* Jemné tajomné svetlo */
    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: #8d42ff;
      filter: blur(140px);
      opacity: 0.22;
      animation: pulse 4s ease-in-out infinite;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    /* WG LOGO */
    .logo {
      width: 190px;
      height: 190px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid rgba(255,255,255,0.85);
      border-radius: 48px;

      background:
        linear-gradient(145deg,
          rgba(255,255,255,0.12),
          rgba(130,55,255,0.08)
        );

      box-shadow:
        0 0 20px rgba(160, 80, 255, 0.55),
        0 0 70px rgba(120, 45, 255, 0.25),
        inset 0 0 35px rgba(255,255,255,0.06);

      animation: float 5s ease-in-out infinite;
      position: relative;
    }

    .logo::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 55px;
      border: 1px solid rgba(181, 115, 255, 0.25);
      animation: rotate 12s linear infinite;
    }

    .wg {
      font-size: 82px;
      font-weight: 900;
      letter-spacing: -10px;
      color: white;
      text-shadow:
        0 0 10px white,
        0 0 25px #a85cff,
        0 0 50px #6d20ff;
      transform: translateX(-5px);
    }

    .brand {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 12px;
      margin-left: 12px;

      background: linear-gradient(
        90deg,
        #ffffff,
        #dcbaff,
        #ffffff
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-shadow: 0 0 25px rgba(166, 91, 255, 0.45);
    }

    .coming {
      margin-top: 24px;
      font-size: 13px;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      animation: flicker 3s infinite;
    }

    .line {
      width: 100px;
      height: 1px;
      margin: 22px auto;
      background: linear-gradient(
        90deg,
        transparent,
        #b46cff,
        transparent
      );
      box-shadow: 0 0 15px #9b4dff;
    }

    .mystery {
      font-size: 11px;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.3);
    }

    /* Dekoratívne bodky */
    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1px),
        radial-gradient(circle, rgba(173,91,255,.5) 1px, transparent 1px);
      background-size: 90px 90px, 140px 140px;
      background-position: 10px 20px, 50px 80px;
      opacity: .22;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(0.9);
        opacity: .18;
      }
      50% {
        transform: scale(1.15);
        opacity: .3;
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes flicker {
      0%, 18%, 20%, 22%, 65%, 100% {
        opacity: .7;
      }
      19%, 21%, 64% {
        opacity: .25;
      }
    }

    @media (max-width: 600px) {
      .logo {
        width: 145px;
        height: 145px;
        border-radius: 38px;
      }

      .wg {
        font-size: 62px;
      }

      .brand {
        font-size: 29px;
        letter-spacing: 8px;
      }

      .coming {
        font-size: 10px;
        letter-spacing: 5px;
      }
    }
  </style>
</head>

<body>

  <div class="stars"></div>
  <div class="glow"></div>

  <main class="container">

    <div class="logo">
      <div class="wg">WG</div>
    </div>

    <div class="brand">WAYGO</div>

    <div class="line"></div>

    <div class="coming">
      Už čoskoro
    </div>

    <div class="mystery">
      Something is coming...
    </div>

  </main>

</body>
</html>
