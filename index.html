<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WayGo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Farebné glow gule */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: moveGlow 5s infinite alternate ease-in-out;
        }

        .glow1 {
            background: #7c3cff;
            top: -100px;
            left: -100px;
        }

        .glow2 {
            background: #00e5ff;
            bottom: -100px;
            right: -100px;
            animation-delay: 1s;
        }

        .glow3 {
            background: #ff2bd6;
            top: 45%;
            left: 45%;
            width: 180px;
            height: 180px;
            opacity: 0.25;
        }

        /* Logo */
        .logo-container {
            position: relative;
            z-index: 2;
            text-align: center;
            animation: logoAppear 1.2s cubic-bezier(.17,.67,.3,1.3);
        }

        .logo {
            font-size: clamp(55px, 15vw, 100px);
            font-weight: 900;
            letter-spacing: -5px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #b66cff,
                #00e5ff,
                #ffffff
            );

            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            animation:
                gradientMove 2s linear infinite,
                pulse 1.8s ease-in-out infinite;

            filter:
                drop-shadow(0 0 10px #7c3cff)
                drop-shadow(0 0 30px rgba(0,229,255,.5));
        }

        .tagline {
            margin-top: 15px;
            color: rgba(255,255,255,.65);
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: fadeUp 1.5s ease;
        }

        /* Loading */
        .loading {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: rgba(255,255,255,.12);
            border-radius: 20px;
            overflow: hidden;
        }

        .loading::after {
            content: "";
            display: block;
            width: 35%;
            height: 100%;
            border-radius: 20px;

            background: linear-gradient(
                90deg,
                #7c3cff,
                #00e5ff,
                #ff2bd6
            );

            box-shadow: 0 0 15px #7c3cff;

            animation: loading 3s linear forwards;
        }

        /* Animácie */

        @keyframes logoAppear {
            0% {
                opacity: 0;
                transform: scale(.5) rotate(-5deg);
                filter: blur(15px);
            }

            70% {
                transform: scale(1.08) rotate(1deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
                filter: blur(0);
            }
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 300% center;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loading {
            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }

        @keyframes moveGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(80px, 50px) scale(1.3);
            }
        }
    </style>
</head>

<body>

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
    <div class="glow glow3"></div>

    <div class="logo-container">
        <div class="logo">WayGo</div>
        <div class="tagline">Learn. Scroll. Grow.</div>
    </div>

    <div class="loading"></div>

    <script>
        setTimeout(() => {
            window.location.href = "main.html";
        }, 3000);
    </script>

</body>
</html>
