<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WayGo</title>

    <!-- Premium fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Montserrat:wght@300;400&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            background:
                radial-gradient(
                    ellipse at center,
                    #21132f 0%,
                    #100a17 25%,
                    #070509 55%,
                    #000000 100%
                );

            color: white;
        }


        /* =========================
           BACKGROUND GLOW
        ========================= */

        .background-glow {
            position: absolute;

            width: 550px;
            height: 550px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(155, 78, 255, 0.18),
                    rgba(100, 30, 200, 0.06) 35%,
                    transparent 70%
                );

            filter: blur(20px);

            animation:
                backgroundPulse 7s ease-in-out infinite;
        }


        /* =========================
           MAIN LOGO
        ========================= */

        .logo-container {
            position: relative;

            width: 560px;
            height: 560px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            animation:
                logoEntrance 1.8s cubic-bezier(.16,1,.3,1) forwards,
                floating 6s ease-in-out 4s infinite;
        }


        /* =========================
           BIG ORBIT
        ========================= */

        .orbit {
            position: absolute;

            width: 540px;
            height: 540px;

            border-radius: 50%;

            border: 1px solid rgba(185, 125, 255, 0.13);

            transform: rotate(-20deg);

            opacity: 0;

            animation:
                orbitEntrance 2s ease 1s forwards;
        }


        /* =========================
           SVG
        ========================= */

        svg {
            position: relative;

            width: 310px;
            height: 250px;

            overflow: visible;
        }


        /* =========================
           LOGO STROKES
        ========================= */

        .logo-line {

            fill: none;

            stroke: url(#purpleGradient);

            stroke-width: 4;

            stroke-linecap: round;

            stroke-linejoin: round;

            stroke-dasharray: 1000;

            stroke-dashoffset: 1000;

            filter:
                drop-shadow(
                    0 0 4px rgba(183, 112, 255, 0.9)
                );

            animation:
                drawLogo 2.8s
                cubic-bezier(.65,0,.35,1)
                forwards;
        }


        .w {
            animation-delay: 0.15s;
        }


        .g {
            animation-delay: 1.05s;
        }


        /* =========================
           WAYGO
        ========================= */

        .brand {

            margin-top: -8px;

            font-family:
                "Bodoni Moda",
                serif;

            font-size: 58px;

            font-weight: 400;

            letter-spacing: 8px;

            color: #ffffff;

            opacity: 0;

            text-shadow:
                0 0 25px rgba(255, 255, 255, 0.06);

            animation:
                brandEntrance 1.4s
                cubic-bezier(.16,1,.3,1)
                2.6s
                forwards;
        }


        /* =========================
           LINE
        ========================= */

        .brand-line {

            width: 0;

            height: 1px;

            margin-top: 15px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(180, 105, 255, 0.8),
                    transparent
                );

            animation:
                lineEntrance 1.4s ease 3.2s forwards;
        }


        /* =========================
           MICRO TEXT
        ========================= */

        .micro {

            margin-top: 12px;

            font-family:
                "Montserrat",
                sans-serif;

            font-size: 7px;

            font-weight: 300;

            letter-spacing: 6px;

            color:
                rgba(255, 255, 255, 0.32);

            text-transform: uppercase;

            opacity: 0;

            animation:
                microEntrance 1s ease 3.5s forwards;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes drawLogo {

            to {
                stroke-dashoffset: 0;
            }
        }


        @keyframes logoEntrance {

            from {
                opacity: 0;

                transform:
                    scale(0.92)
                    translateY(15px);
            }

            to {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }


        @keyframes floating {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }


        @keyframes backgroundPulse {

            0%, 100% {
                transform: scale(0.9);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }


        @keyframes orbitEntrance {

            from {
                opacity: 0;

                transform:
                    scale(0.75)
                    rotate(-20deg);
            }

            to {
                opacity: 1;

                transform:
                    scale(1)
                    rotate(-20deg);
            }
        }


        @keyframes brandEntrance {

            from {
                opacity: 0;

                transform: translateY(18px);

                letter-spacing: 16px;
            }

            to {
                opacity: 1;

                transform: translateY(0);

                letter-spacing: 8px;
            }
        }


        @keyframes lineEntrance {

            from {
                width: 0;
                opacity: 0;
            }

            to {
                width: 170px;
                opacity: 1;
            }
        }


        @keyframes microEntrance {

            from {
                opacity: 0;

                transform: translateY(5px);
            }

            to {
                opacity: 1;

                transform: translateY(0);
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .logo-container {
                transform: scale(0.65);
            }

            .orbit {
                width: 540px;
                height: 540px;
            }
        }

    </style>
</head>


<body>

    <div class="background-glow"></div>


    <div class="logo-container">

        <div class="orbit"></div>


        <svg viewBox="0 0 310 250">

            <defs>

                <linearGradient
                    id="purpleGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%"
                >

                    <stop
                        offset="0%"
                        stop-color="#d09aff"
                    />

                    <stop
                        offset="45%"
                        stop-color="#a45cff"
                    />

                    <stop
                        offset="100%"
                        stop-color="#7135d6"
                    />

                </linearGradient>

            </defs>


            <!-- W -->

            <path
                class="logo-line w"
                d="
                    M 48 55

                    C 54 88,
                      64 137,
                      75 170

                    C 80 184,
                      88 184,
                      95 165

                    L 118 92

                    C 122 78,
                      127 78,
                      132 93

                    L 151 165

                    C 155 183,
                      163 183,
                      169 164

                    L 204 55
                "
            />


            <!-- G -->

            <path
                class="logo-line g"
                d="
                    M 250 72

                    C 242 55,
                      226 50,
                      212 59

                    C 192 72,
                      187 103,
                      191 130

                    C 195 158,
                      209 174,
                      228 174

                    C 246 174,
                      255 159,
                      254 138

                    L 230 138
                "
            />

        </svg>


        <div class="brand">
            WayGo
        </div>


        <div class="brand-line"></div>


        <div class="micro">
            FIND YOUR WAY
        </div>

    </div>


    <script>

        setTimeout(() => {

            window.location.href = "login.html";

        }, 5000);

    </script>

</body>
</html>
