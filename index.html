<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WayGo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #03020d;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* jemná fialová žiara za logom */
        body::before {
            content: "";
            position: absolute;

            width: 400px;
            height: 400px;

            background: radial-gradient(
                circle,
                rgba(145, 55, 255, 0.22) 0%,
                rgba(80, 20, 180, 0.08) 40%,
                transparent 70%
            );

            filter: blur(20px);
        }

        .splash {
            position: relative;
            z-index: 2;

            animation: logoIn 1.2s ease-out forwards;
        }

        .logo {
            font-size: clamp(70px, 15vw, 150px);
            font-weight: 900;
            letter-spacing: -8px;

            color: #ffffff;

            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.4),
                0 0 30px rgba(155, 60, 255, 0.5),
                0 0 70px rgba(155, 60, 255, 0.3);
        }

        .logo span {
            background: linear-gradient(
                135deg,
                #e7b7ff,
                #a63dff 50%,
                #6e22d9
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            text-shadow: none;
        }

        @keyframes logoIn {
            0% {
                opacity: 0;
                transform: scale(.8);
                filter: blur(12px);
            }

            60% {
                opacity: 1;
                transform: scale(1.05);
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="splash">
        <div class="logo">
            Way<span>Go</span>
        </div>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = "home.html";
        }, 3000);
    </script>

</body>
</html>
