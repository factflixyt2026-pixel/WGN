<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Môj účet | StudySpace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #09070f;
    color: #fff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    padding: 35px 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
}

.logo {
    font-size: 23px;
    font-weight: bold;
}

.logo span {
    color: #a66aff;
}

.status {
    color: #a99dbb;
    font-size: 13px;
}

.card {
    background: #151020;
    border: 1px solid #30213f;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 20px;
}

.profile {
    display: flex;
    align-items: center;
    gap: 20px;
}

.avatar {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #a66aff;
    background: #291a3d;
}

.profile h1 {
    font-size: 25px;
    margin-bottom: 5px;
}

.muted {
    color: #a99dbb;
    font-size: 14px;
}

button {
    background: #8149d6;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #9a63ed;
}

.edit {
    margin-left: auto;
    background: #251a35;
    border: 1px solid #493362;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

h2 {
    font-size: 18px;
    margin-bottom: 7px;
}

.subtitle {
    color: #a99dbb;
    font-size: 13px;
    margin-bottom: 20px;
}

.rank {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid #30213f;
}

.rank:last-child {
    border: none;
}

.number {
    color: #b995f5;
    font-weight: bold;
    width: 25px;
}

.rank img {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
}

.rank-name {
    flex: 1;
    font-weight: bold;
}

.points {
    color: #b995f5;
    font-size: 13px;
}

.modal {
    position: fixed;
    inset: 0;
    background: #000d;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-content {
    width: 100%;
    max-width: 420px;
    background: #171021;
    border: 1px solid #493362;
    border-radius: 20px;
    padding: 28px;
}

.modal-content h2 {
    font-size: 22px;
    margin-bottom: 8px;
}

.modal-content p {
    color: #a99dbb;
    font-size: 13px;
    margin-bottom: 20px;
}

label {
    display: block;
    margin: 15px 0 7px;
    color: #d6c9e9;
    font-size: 13px;
}

input {
    width: 100%;
    padding: 13px;
    background: #0c0913;
    color: white;
    border: 1px solid #493362;
    border-radius: 9px;
    outline: none;
}

input:focus {
    border-color: #a66aff;
}

.modal-content button {
    width: 100%;
    margin-top: 20px;
}

.error {
    color: #ff8498;
    font-size: 13px;
    margin-top: 10px;
}

@media(max-width: 700px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .profile {
        flex-wrap: wrap;
    }

    .edit {
        margin-left: 0;
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">STUDY<span>SPACE</span></div>
    <div class="status" id="status">Môj účet</div>
</header>

<!-- PROFIL -->
<div class="card profile">

    <img
        id="avatar"
        class="avatar"
        src="https://placehold.co/100x100/241735/ffffff?text=+"
        alt="Profilová fotografia"
    >

    <div>
        <h1 id="firstName">Tvoj účet</h1>
        <p class="muted">Vitaj späť v StudySpace.</p>
    </div>

    <button class="edit" onclick="editProfile()">
        Upraviť profil
    </button>

</div>

<div class="grid">

    <!-- MESAČNÝ REBRÍČEK -->
    <div class="card">
        <h2>🏆 Top študenti</h2>
        <p class="subtitle">Najlepší študenti za tento mesiac</p>

        <div id="monthly">
            Načítavam...
        </div>
    </div>

    <!-- ROČNÝ REBRÍČEK -->
    <div class="card">
        <h2>👑 Top študenti</h2>
        <p class="subtitle">Najlepší študenti za tento rok</p>

        <div id="yearly">
            Načítavam...
        </div>
    </div>

</div>
</div>

<!-- MODÁLNE OKNO PROFILU -->
<div class="modal" id="profileModal">

    <div class="modal-content">

        <h2 id="modalTitle">Vytvor si profil</h2>

        <p>
            Aby si mohol používať StudySpace,
            najskôr si nastav svoje meno a profilovú fotografiu.
        </p>

        <form id="profileForm">

            <label>Krstné meno</label>
            <input
                type="text"
                id="firstNameInput"
                placeholder="Tvoje krstné meno"
                maxlength="40"
                required
            >

            <label>Profilová fotografia</label>
            <input
                type="file"
                id="avatarInput"
                accept="image/png,image/jpeg,image/webp"
            >

            <div class="error" id="error"></div>

            <button type="submit" id="saveButton">
                Uložiť profil
            </button>

        </form>

    </div>
</div>

<script>

// ======================================
// SUPABASE NASTAVENIE
// ======================================

const SUPABASE_URL = "TVOJA_SUPABASE_URL";
const SUPABASE_KEY = "TVOJ_SUPABASE_ANON_KEY";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;


// ======================================
// PROFIL
// ======================================

function editProfile() {
    document.getElementById("modalTitle").textContent =
        "Upraviť profil";

    document.getElementById("firstNameInput").value =
        currentProfile?.first_name || "";

    document.getElementById("avatarInput").value = "";

    document.getElementById("profileModal").style.display =
        "flex";
}


async function loadProfile() {

    const { data, error } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

    if (error) throw error;

    currentProfile = data;

    if (!data || !data.first_name) {

        document.getElementById("modalTitle").textContent =
            "Vytvor si profil";

        document.getElementById("profileModal").style.display =
            "flex";

    } else {

        document.getElementById("firstName").textContent =
            data.first_name;

        if (data.avatar_url) {
            document.getElementById("avatar").src =
                data.avatar_url;
        }
    }
}


// ======================================
// ULOŽENIE PROFILU
// ======================================

document.getElementById("profileForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const errorBox = document.getElementById("error");
    const button = document.getElementById("saveButton");

    errorBox.textContent = "";

    const firstName =
        document.getElementById("firstNameInput").value.trim();

    const file =
        document.getElementById("avatarInput").files[0];

    if (!firstName) {
        errorBox.textContent = "Zadaj svoje krstné meno.";
        return;
    }

    if (file && file.size > 5 * 1024 * 1024) {
        errorBox.textContent = "Fotka môže mať maximálne 5 MB.";
        return;
    }

    if (file && !["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
        errorBox.textContent = "Použi JPG, PNG alebo WebP.";
        return;
    }

    button.disabled = true;
    button.textContent = "Ukladám...";

    try {

        let avatarUrl = currentProfile?.avatar_url || null;

        if (file) {

            const extension = file.name.split(".").pop().toLowerCase();

            const path =
                `${currentUser.id}/avatar-${Date.now()}.${extension}`;

            const { error: uploadError } = await supabase
                .storage
                .from("avatars")
                .upload(path, file, {
                    upsert: true,
                    contentType: file.type
                });

            if (uploadError) throw uploadError;

            const { data } = supabase
                .storage
                .from("avatars")
                .getPublicUrl(path);

            avatarUrl = data.publicUrl;
        }

        const { data, error } = await supabase
            .from("profiles")
            .upsert({
                id: currentUser.id,
                first_name: firstName,
                avatar_url: avatarUrl
            })
            .select()
            .single();

        if (error) throw error;

        currentProfile = data;

        document.getElementById("firstName").textContent =
            data.first_name;

        if (data.avatar_url) {
            document.getElementById("avatar").src =
                data.avatar_url;
        }

        document.getElementById("profileModal").style.display =
            "none";

    } catch (error) {

        errorBox.textContent = error.message;

    } finally {

        button.disabled = false;
        button.textContent = "Uložiť profil";
    }

});


// ======================================
// REBRÍČKY
// ======================================

function renderRanking(elementId, students) {

    const element = document.getElementById(elementId);

    if (!students || students.length === 0) {

        element.innerHTML =
            '<p class="muted">Zatiaľ tu nie sú žiadni študenti.</p>';

        return;
    }

    element.innerHTML = students.map((student, index) => {

        const name = String(student.first_name || "Študent")
            .replace(/[&<>"']/g, c => ({
                "&":"&amp;","<":"&lt;",">":"&gt;",
                '"':"&quot;","'":"&#39;"
            }[c]));

        const avatar = String(student.avatar_url ||
            "https://placehold.co/80x80/241735/ffffff?text=+");

        const safeAvatar = avatar.replace(/"/g, "%22");

        return `
            <div class="rank">

                <span class="number">
                    ${index + 1}.
                </span>

                <img src="${safeAvatar}" alt="">

                <span class="rank-name">
                    ${name}
                </span>

                <span class="points">
                    ${Number(student.points || 0).toLocaleString("sk-SK")} b.
                </span>

            </div>
        `;

    }).join("");
}


async function loadLeaderboards() {

    const [month, year] = await Promise.all([

        supabase.rpc("leaderboard_month"),

        supabase.rpc("leaderboard_year")

    ]);

    if (month.error) throw month.error;
    if (year.error) throw year.error;

    renderRanking("monthly", month.data);
    renderRanking("yearly", year.data);
}


// ======================================
// PRIHLÁSENIE A SPUSTENIE
// ======================================

async function init() {

    const { data: { session }, error } =
        await supabase.auth.getSession();

    if (error) throw error;

    if (!session) {

        document.getElementById("status").textContent =
            "Nie si prihlásený/á";

        document.getElementById("monthly").textContent =
            "Najskôr sa prihlás.";

        document.getElementById("yearly").textContent =
            "Najskôr sa prihlás.";

        return;
    }

    currentUser = session.user;

    await loadProfile();
    await loadLeaderboards();

    document.getElementById("status").textContent =
        "Tvoj účet";
}


init().catch(error => {

    console.error(error);

    document.getElementById("status").textContent =
        "Chyba pri načítaní";

});


// Reakcia na zmenu prihlásenia
supabase.auth.onAuthStateChange((event, session) => {

    if (event === "SIGNED_OUT") {
        location.reload();
    }

});

</script>

</body>
</html>
