<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WayGo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* =========================
           BACKGROUND GLOW
        ========================= */

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(110px);
            pointer-events: none;
            z-index: 0;
        }

        .glow1 {
            width: 350px;
            height: 350px;
            background: #7c3cff;
            top: -150px;
            left: -120px;
            opacity: 0.35;
        }

        .glow2 {
            width: 300px;
            height: 300px;
            background: #00e5ff;
            right: -120px;
            bottom: -100px;
            opacity: 0.25;
        }

        .glow3 {
            width: 250px;
            height: 250px;
            background: #ff2bd6;
            left: 40%;
            top: 45%;
            opacity: 0.12;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            position: relative;
            z-index: 1;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 45px 20px;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -2px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #a66cff,
                #00e5ff,
                #ffffff
            );

            background-size: 250% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation: gradientMove 3s linear infinite;

            filter:
                drop-shadow(0 0 12px rgba(124, 60, 255, 0.5));
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            width: 100%;
            max-width: 600px;

            margin-top: 85px;

            text-align: center;
        }

        h1 {
            font-size: clamp(38px, 8vw, 64px);
            line-height: 1.05;

            letter-spacing: -3px;

            margin-bottom: 18px;
        }

        h1 span {
            background: linear-gradient(
                90deg,
                #9b5cff,
                #00e5ff
            );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.55);

            font-size: 17px;

            line-height: 1.5;

            margin-bottom: 45px;
        }

        /* =========================
           LANGUAGES
        ========================= */

        .languages {
            display: flex;
            flex-direction: column;

            gap: 16px;

            width: 100%;
        }

        .language {
            width: 100%;
            min-height: 92px;

            display: flex;
            align-items: center;

            padding: 0 24px;

            border-radius: 23px;

            border: 1px solid rgba(255, 255, 255, 0.1);

            background: rgba(255, 255, 255, 0.055);

            backdrop-filter: blur(15px);

            color: white;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .language:hover {
            transform: translateY(-5px) scale(1.015);

            border-color: rgba(150, 100, 255, 0.75);

            background: rgba(124, 60, 255, 0.13);

            box-shadow:
                0 12px 45px rgba(124, 60, 255, 0.25);
        }

        .language:active {
            transform: scale(0.97);
        }

        /* =========================
           FLAGS
        ========================= */

        .flag {
            font-size: 40px;

            margin-right: 20px;

            transition: transform 0.25s ease;
        }

        .language:hover .flag {
            transform: scale(1.15) rotate(-3deg);
        }

        /* =========================
           LANGUAGE TEXT
        ========================= */

        .language-info {
            flex: 1;

            text-align: left;
        }

        .language-name {
            font-size: 21px;

            font-weight: 800;

            margin-bottom: 5px;
        }

        .language-native {
            font-size: 13px;

            color: rgba(255, 255, 255, 0.4);
        }

        /* =========================
           ARROW
        ========================= */

        .arrow {
            font-size: 27px;

            color: rgba(255, 255, 255, 0.35);

            transition:
                transform 0.25s ease,
                color 0.25s ease;
        }

        .language:hover .arrow {
            transform: translateX(7px);

            color: white;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 45px;

            color: rgba(255, 255, 255, 0.25);

            font-size: 12px;

            letter-spacing: 1px;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes gradientMove {

            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 250% center;
            }

        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .container {
                padding: 35px 18px;
            }

            .content {
                margin-top: 70px;
            }

            h1 {
                font-size: 43px;
            }

            .subtitle {
                font-size: 15px;

                margin-bottom: 35px;
            }

            .language {
                min-height: 82px;

                padding: 0 20px;

                border-radius: 20px;
            }

            .flag {
                font-size: 32px;

                margin-right: 16px;
            }

            .language-name {
                font-size: 18px;
            }

            .arrow {
                font-size: 23px;
            }
        }
    </style>
</head>


<body>

    <!-- Background -->
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
    <div class="glow glow3"></div>


    <!-- Main -->
    <main class="container">

        <!-- Logo -->
        <div class="logo">
            WayGo
        </div>


        <!-- Content -->
        <section class="content">

            <h1>
                Choose your<br>
                <span>language.</span>
            </h1>

            <p class="subtitle">
                Pick a language and start your learning journey.
            </p>


            <!-- Languages -->
            <div class="languages">


                <!-- ENGLISH -->
                <div
                    class="language"
                    onclick="selectLanguage('english.html')"
                >

                    <div class="flag">
                        🇬🇧
                    </div>

                    <div class="language-info">

                        <div class="language-name">
                            English
                        </div>

                        <div class="language-native">
                            English
                        </div>

                    </div>

                    <div class="arrow">
                        →
                    </div>

                </div>


                <!-- FRANÇAIS -->
                <div
                    class="language"
                    onclick="selectLanguage('francais.html')"
                >

                    <div class="flag">
                        🇫🇷
                    </div>

                    <div class="language-info">

                        <div class="language-name">
                            Français
                        </div>

                        <div class="language-native">
                            French
                        </div>

                    </div>

                    <div class="arrow">
                        →
                    </div>

                </div>


                <!-- SLOVENČINA -->
                <div
                    class="language"
                    onclick="selectLanguage('slovencina.html')"
                >

                    <div class="flag">
                        🇸🇰
                    </div>

                    <div class="language-info">

                        <div class="language-name">
                            Slovenčina
                        </div>

                        <div class="language-native">
                            Slovak
                        </div>

                    </div>

                    <div class="arrow">
                        →
                    </div>

                </div>


            </div>


            <!-- Footer -->
            <div class="footer">
                Learn. Scroll. Grow. 🚀
            </div>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        function selectLanguage(page) {

            window.location.href = page;

        }

    </script>

</body>

</html>
