<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WayGO</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #35106b 0%,
                    #19052f 38%,
                    #080013 72%,
                    #020005 100%
                );

            overflow: hidden;
        }

        /* ===============================
           VESMÍR
        =============================== */

        .space {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;
        }

        .nebula {
            position: absolute;

            width: 750px;
            height: 750px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(168, 85, 247, 0.22),
                    rgba(126, 34, 206, 0.08) 40%,
                    transparent 70%
                );

            filter: blur(50px);
        }

        /* ===============================
           HVIEZDY
        =============================== */

        .star {
            position: absolute;

            background: white;

            border-radius: 50%;

            box-shadow:
                0 0 5px white,
                0 0 10px #c084fc;

            animation:
                twinkle
                var(--duration)
                ease-in-out
                infinite alternate;
        }

        @keyframes twinkle {

            from {
                opacity: var(--opacity);
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1.4);
            }

        }

        /* ===============================
           HLAVNÝ OBSAH
        =============================== */

        .container {

            position: relative;

            z-index: 5;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 30px 20px;

            text-align: center;
        }

        /* ===============================
           LOGO
        =============================== */

        .logo {

            font-size:
                clamp(50px, 11vw, 100px);

            font-weight: 900;

            letter-spacing: 8px;

            margin-bottom: 45px;

            color: white;

            text-shadow:
                0 0 10px white,
                0 0 25px #e9d5ff,
                0 0 50px #c084fc,
                0 0 80px #a855f7,
                0 0 120px #7e22ce;
        }

        /* ===============================
           NADPIS
        =============================== */

        .title {

            font-size:
                clamp(28px, 6vw, 48px);

            margin-bottom: 30px;

            color: white;

            text-shadow:
                0 0 20px rgba(192,132,252,0.5);
        }

        /* ===============================
           JAZYKY
        =============================== */

        .languages {

            width: min(520px, 100%);

            display: flex;

            flex-direction: column;

            gap: 18px;
        }

        .language {

            position: relative;

            width: 100%;

            min-height: 90px;

            display: flex;

            align-items: center;

            padding: 18px 25px;

            border-radius: 20px;

            border: 1px solid
                rgba(216,180,254,0.25);

            background:
                rgba(255,255,255,0.06);

            backdrop-filter: blur(12px);

            color: white;

            text-decoration: none;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .language:hover {

            transform:
                translateY(-4px)
                scale(1.02);

            background:
                rgba(168,85,247,0.15);

            border-color:
                rgba(216,180,254,0.75);

            box-shadow:
                0 10px 35px
                rgba(126,34,206,0.35),

                0 0 25px
                rgba(168,85,247,0.2);
        }

        /* ===============================
           VLÁJKA
        =============================== */

        .flag {

            font-size: 42px;

            width: 65px;

            margin-right: 20px;
        }

        /* ===============================
           NÁZOV JAZYKA
        =============================== */

        .language-name {

            font-size: 23px;

            font-weight: 700;

            text-align: left;

            letter-spacing: 0.5px;
        }

        /* ===============================
           ŠÍPKA
        =============================== */

        .arrow {

            margin-left: auto;

            font-size: 30px;

            color: #c084fc;

            transition:
                transform 0.25s ease;
        }

        .language:hover .arrow {

            transform:
                translateX(7px);
        }

        /* ===============================
           MOBIL
        =============================== */

        @media (max-width: 600px) {

            .logo {
                margin-bottom: 35px;
            }

            .title {
                margin-bottom: 25px;
            }

            .language {
                min-height: 80px;
                padding: 15px 18px;
            }

            .flag {
                font-size: 34px;
                width: 50px;
                margin-right: 15px;
            }

            .language-name {
                font-size: 20px;
            }

            .arrow {
                font-size: 24px;
            }
        }

    </style>
</head>


<body>

    <!-- Vesmír -->

    <div class="space">

        <div class="nebula"></div>

    </div>


    <!-- Obsah -->

    <main class="container">

        <div class="logo">
            WayGO
        </div>


        <h1 class="title">
            Choose your language
        </h1>


        <div class="languages">

            <!-- SLOVENČINA -->

            <a
                href="slovencina.html"
                class="language"
            >

                <div class="flag">
                    🇸🇰
                </div>

                <div class="language-name">
                    Slovenčina
                </div>

                <div class="arrow">
                    →
                </div>

            </a>


            <!-- ENGLISH -->

            <a
                href="english.html"
                class="language"
            >

                <div class="flag">
                    🇬🇧
                </div>

                <div class="language-name">
                    English
                </div>

                <div class="arrow">
                    →
                </div>

            </a>


            <!-- FRANÇAIS -->

            <a
                href="francuzstina.html"
                class="language"
            >

                <div class="flag">
                    🇫🇷
                </div>

                <div class="language-name">
                    Français
                </div>

                <div class="arrow">
                    →
                </div>

            </a>

        </div>

    </main>


    <script>

        /* ===============================
           NÁHODNÉ HVIEZDY
        =============================== */

        const space =
            document.querySelector(".space");

        const numberOfStars = 180;

        for (
            let i = 0;
            i < numberOfStars;
            i++
        ) {

            const star =
                document.createElement("div");

            star.classList.add("star");

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            const size =
                Math.random() * 2.5 + 1;

            star.style.width =
                size + "px";

            star.style.height =
                size + "px";

            star.style.setProperty(
                "--opacity",
                Math.random() * 0.6 + 0.25
            );

            star.style.setProperty(
                "--duration",
                Math.random() * 3 + 1.5 + "s"
            );

            star.style.animationDelay =
                Math.random() * 4 + "s";

            space.appendChild(star);
        }

    </script>

</body>

</html>
